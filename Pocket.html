}
function closeMonthlyReview() {
  switchTab('daily');
}
function changeReviewYear(delta) {
  reviewYear += delta;
  renderMonthlyReview();
}

function renderMonthlyReview() {
  $('reviewYearLabel').textContent = reviewYear + '年';
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // Build per-month data
  var months = [];
  for (var m0=0; m0<12; m0++) {
    var future = isFutureReviewMonth(reviewYear, m0);
    var budget = getReviewMonthlyBudget(m0);
    var range = reviewMonthRange(reviewYear, m0);
    var colVals = [];
    var total = 0;
    for (var ci=0; ci<REVIEW_COLS.length; ci++) {
      var v = sumCatForRange(range[0], range[1], REVIEW_COLS[ci].path);
      colVals.push(v);
      total += v;
    }
    var balance = budget - total;
    months.push({m0:m0, future:future, budget:budget, colVals:colVals, total:total, balance:balance});
  }

  // 年度合计（含未来月份已记录的数据）
  var ytdBudget = 0, ytdTotal = 0, ytdColTotals = [];
  for (var ci3=0; ci3<REVIEW_COLS.length; ci3++) ytdColTotals.push(0);
  var hasYtd = true;
  for (var mi=0; mi<12; mi++) {
    ytdBudget += months[mi].budget;
    ytdTotal += months[mi].total;
    for (var ci4=0; ci4<REVIEW_COLS.length; ci4++) ytdColTotals[ci4] += months[mi].colVals[ci4];
  }
  var fullYearBudget = 0;
  for (var mi2=0; mi2<12; mi2++) fullYearBudget += months[mi2].budget;

  // Annual special data
  var insData = getAnnualCatData(reviewYear, ['保险']);
  var spcData = getAnnualCatData(reviewYear, null, '特殊');
  var travData = getAnnualCatData(reviewYear, ['旅游']);
  var travGiftData = getAnnualCatData(reviewYear, ['旅游礼物']);
  var piggyExpData = getAnnualCatData(reviewYear, null, '储蓄罐');
  var travelActual = travData.sum + travGiftData.sum;
  var b = getBudgetForYear(reviewYear);
  var specials = [
    {name:'保险', budget:b.insurance||0, actual:insData.sum, list:insData.list},
    {name:'特殊', budget:b.special||0, actual:spcData.sum, list:spcData.list},
    {name:'旅游', budget:b.travel||0, actual:travelActual, travList:travData.list, giftList:travGiftData.list, isTravelCard:true},
    {name:'储蓄罐', actual:piggyExpData.sum, list:piggyExpData.list, isNoBudget:true}
  ];
  var specialBalanceSum = 0;
  for (var si=0; si<specials.length; si++) { if (specials[si].isNoBudget) continue; specialBalanceSum += (specials[si].budget - specials[si].actual); }

  // Year total balance
  var yearTotalBalance = (hasYtd ? (ytdBudget - ytdTotal) : 0) + specialBalanceSum;
  lastReviewYearBalance = yearTotalBalance;
  var balEl = $('reviewYearBalance');
  balEl.textContent = '¥ ' + formatMoney(yearTotalBalance);
  balEl.style.color = yearTotalBalance >= 0 ? 'var(--success)' : 'var(--danger)';

  // ===== Build table =====
  var html = '<table class="mr-table"><thead>';
  // precompute per-column group boundary (first column of each group gets a divider)
  var colGroupStart = [];
  for (var gpi=0; gpi<REVIEW_GROUPS.length; gpi++) {
    var gp = REVIEW_GROUPS[gpi];
    for (var gci=0; gci<gp.cols.length; gci++) { colGroupStart.push(gci===0); }
  }

  // group class lookup: 居住=blue, 饮食=dark, 交通起交替light/dark
  var grpClasses = [];
  for (var gpi=0; gpi<REVIEW_GROUPS.length; gpi++) {
    var gname = REVIEW_GROUPS[gpi].label;
    if (gname==='居住') grpClasses.push('mr-grp-blue');
    else if (gname==='饮食') grpClasses.push('mr-grp-dark');
    else grpClasses.push((gpi%2===0)?'mr-grp-light':'mr-grp-dark');
  }

  // header row 1 (groups)
  html += '<tr><th rowspan="2" class="mr-sticky-l0">月份</th><th rowspan="2" class="mr-sticky-l1">预算</th>';
  for (var gi=0; gi<REVIEW_GROUPS.length; gi++) {
    var g = REVIEW_GROUPS[gi];
    html += '<th colspan="'+g.cols.length+'" class="'+grpClasses[gi]+' mr-grp-start">'+escHtml(g.label)+'</th>';
  }
  html += '<th rowspan="2" class="mr-col-total">合计</th><th rowspan="2" class="mr-sticky-r1">结余</th></tr>';
  // header row 2 (cols)
  html += '<tr>';
  for (var gi2=0; gi2<REVIEW_GROUPS.length; gi2++) {
    var g2 = REVIEW_GROUPS[gi2];
    for (var ci5=0; ci5<g2.cols.length; ci5++) {
      var lbl = g2.cols.length>1 ? g2.cols[ci5].label : '';
      html += '<th class="'+grpClasses[gi2]+(ci5===0?' mr-grp-start':'')+'">'+escHtml(lbl)+'</th>';
    }
  }
  html += '</tr></thead><tbody>';

  // month rows (1-12)
  var now = new Date();
  for (var m=0; m<12; m++) {
    var md = months[m];
    var isCurrent = (reviewYear===now.getFullYear() && m===now.getMonth());
    var rowClass = md.future ? 'mr-future' : (isCurrent ? 'mr-current' : '');
    html += '<tr'+(rowClass?(' class="'+rowClass+'"'):'')+'>';
    html += '<td class="mr-sticky-l0">'+monthNames[m]+(isCurrent?' (本月)':'')+'</td>';
    html += '<td class="mr-sticky-l1"><span class="mr-budget-edit" onclick="editMonthAdjust('+m+')">'+fmtBudgetCell(md.budget)+'</span></td>';
    for (var ci7=0; ci7<REVIEW_COLS.length; ci7++) {
      html += '<td'+(colGroupStart[ci7]?' class="mr-grp-start"':'')+'>'+fmtCell(md.colVals[ci7])+'</td>';
    }
    html += '<td class="mr-col-total">'+fmtCell(md.total)+'</td>';
    var balClass = md.balance===null ? '' : (md.balance>=0?' mr-balance-pos':' mr-balance-neg');
    html += '<td class="mr-sticky-r1'+balClass+'">'+(md.balance===null?'-':formatMoney(md.balance))+'</td>';
    html += '</tr>';
  }

  // YTD row at bottom
  var ytdBal = hasYtd ? (ytdBudget - ytdTotal) : null;
  html += '<tr class="mr-ytd">';
  html += '<td class="mr-sticky-l0">年度合计</td>';
  html += '<td class="mr-sticky-l1">'+fmtBudgetCell(fullYearBudget)+'</td>';
  for (var ci6=0; ci6<REVIEW_COLS.length; ci6++) {
    html += '<td'+(colGroupStart[ci6]?' class="mr-grp-start"':'')+'>'+(hasYtd?fmtCell(ytdColTotals[ci6]):'-')+'</td>';
  }
  html += '<td class="mr-col-total">'+(hasYtd?fmtCell(ytdTotal):'-')+'</td>';
  html += '<td class="mr-sticky-r1'+(ytdBal===null?'':(ytdBal>=0?' mr-balance-pos':' mr-balance-neg'))+'">'+(ytdBal===null?'-':formatMoney(ytdBal))+'</td>';
  html += '</tr>';
  html += '</tbody></table>';
  $('reviewTableScroll').innerHTML = html;

  // ===== Annual special cards =====
  var cardsHtml = '';
  for (var sci=0; sci<specials.length; sci++) {
    var sp = specials[sci];
    if (sp.isNoBudget) {
      var piggyBal = getPiggyBalance();
      cardsHtml += '<div class="mr-special-card">';
      cardsHtml += '<div class="mr-special-top">' +
        '<div style="flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:var(--fs-22);">🪙</div>' +
        '<div style="flex:1;"><div class="mr-special-name">'+escHtml(sp.name)+'<span style="margin-left:14px;font-weight:700;color:var(--success);">&yen;'+formatMoney(piggyBal)+'</span></div>' +
        '<div class="mr-special-nums">今年支出 '+formatMoney(sp.actual)+'</div></div></div>';
      if (sp.list.length === 0) {
        cardsHtml += '<div class="mr-special-list"><div class="mr-special-empty">暂无记录</div></div>';
      } else {
        cardsHtml += '<div class="mr-special-list">';
        for (var lpi=0; lpi<sp.list.length; lpi++) {
          var recp = sp.list[lpi];
          var dsp = fmtDateShort(recp.date);
          var cpp = recp.catPath||[]; var lcp = cpp.length>0?cpp[cpp.length-1]:'';
          var ctp = lcp?' '+escHtml(lcp):''; var ntp = recp.note?' '+escHtml(recp.note):'';
          cardsHtml += '<div class="mr-special-row" onclick="showRecordAction(\''+recp.id+'\')"><span>'+dsp+ctp+ntp+'</span><span>'+formatMoney(getRmbAmt(recp))+'</span></div>';
        }
        cardsHtml += '</div>';
      }
      cardsHtml += '</div>';
      continue;
    }
    var pct = sp.budget>0 ? Math.min(sp.actual/sp.budget, 1) : (sp.actual>0?1:0);
    var over = sp.budget>0 && sp.actual > sp.budget;
    var circumference = 2*Math.PI*18;
    var dashoffset = circumference * (1-pct);
    var ringColor = over ? 'var(--danger)' : 'var(--success)';
    cardsHtml += '<div class="mr-special-card'+(over?' mr-over':'')+'">';
    cardsHtml += '<div class="mr-special-top"><svg width="44" height="44" viewBox="0 0 44 44">' +
      '<circle cx="22" cy="22" r="18" fill="none" stroke="var(--border)" stroke-width="5"></circle>' +
      '<circle cx="22" cy="22" r="18" fill="none" stroke="'+ringColor+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+circumference.toFixed(2)+'" stroke-dashoffset="'+dashoffset.toFixed(2)+'" transform="rotate(-90 22 22)"></circle>' +
      '</svg><div style="flex:1;"><div class="mr-special-name">'+escHtml(sp.name)+(sp.isTravelCard?' + 旅游礼物':'')+'</div>' +
      '<div class="mr-special-nums">'+formatMoney(sp.actual)+' / '+formatMoney(sp.budget)+'<span style="margin-left:14px;color:'+(sp.budget-sp.actual>=0?'var(--success)':'var(--danger)')+';">'+( sp.budget-sp.actual < 0 ? '-'+formatMoney(Math.abs(sp.budget-sp.actual)) : formatMoney(sp.budget-sp.actual) )+'</span></div></div></div>';
    if (sp.isTravelCard) {
      // 全宽分隔线 + 左右两栏（旅游3份，礼物2份）
      var renderCol = function(list) {
        if (list.length === 0) return '<div class="mr-special-empty">暂无记录</div>';
        var s = '';
        for (var li=0; li<list.length; li++) {
          var rec = list[li];
          var ds = fmtDateShort(rec.date);
          var cp = rec.catPath||[]; var lc = cp.length>0?cp[cp.length-1]:'';
          var ct = lc?' '+escHtml(lc):''; var nt = rec.note?' '+escHtml(rec.note):'';
          s += '<div class="mr-special-row" onclick="showRecordAction(\''+rec.id+'\')"><span>'+ds+ct+nt+'</span><span>'+formatMoney(getRmbAmt(rec))+'</span></div>';
        }
        return s;
      };
      cardsHtml += '<div style="border-top:0.5px solid var(--border);margin-top:10px;padding-top:8px;display:flex;gap:0;">' +
        '<div style="flex:3;min-width:0;">' +
          '<div style="font-size:var(--fs-11);font-weight:600;color:var(--text2);padding-bottom:4px;">旅游 <span style="font-weight:400;">'+formatMoney(travData.sum)+'</span></div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;">'+renderCol(sp.travList)+'</div>' +
        '</div>' +
        '<div style="width:0.5px;background:var(--border);margin:0 10px;"></div>' +
        '<div style="flex:2;min-width:0;">' +
          '<div style="font-size:var(--fs-11);font-weight:600;color:var(--text2);padding-bottom:4px;">旅游礼物 <span style="font-weight:400;">'+formatMoney(travGiftData.sum)+'</span></div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;">'+renderCol(sp.giftList)+'</div>' +
        '</div>' +
      '</div>';
    } else {
      if (sp.list.length === 0) {
        cardsHtml += '<div class="mr-special-list"><div class="mr-special-empty">暂无记录</div></div>';
      } else {
        cardsHtml += '<div class="mr-special-list">';
        for (var li2=0; li2<sp.list.length; li2++) {
          var rec2 = sp.list[li2];
          var dateShort = fmtDateShort(rec2.date);
          var cp2 = rec2.catPath||[]; var leafCat = cp2.length>0?cp2[cp2.length-1]:'';
          var catText = leafCat?' '+escHtml(leafCat):''; var noteText = rec2.note?' '+escHtml(rec2.note):'';
          cardsHtml += '<div class="mr-special-row" onclick="showRecordAction(\''+rec2.id+'\')"><span>'+dateShort+catText+noteText+'</span><span>'+formatMoney(getRmbAmt(rec2))+'</span></div>';
        }
        cardsHtml += '</div>';
      }
    }
    var transferEntry = getSpecialTransfer(reviewYear, sp.name);
    var spBalance = sp.budget - sp.actual;
    if (transferEntry) {
      cardsHtml += '<div class="mr-special-transfer-tag mr-transferred" onclick="showPiggyEntryEditModal(\''+transferEntry.id+'\')">已转入储蓄罐 ¥'+formatMoney(transferEntry.amount)+' · '+fmtDateShort(transferEntry.date)+'</div>';
    } else {
      cardsHtml += '<div class="mr-special-transfer-tag" onclick="showTransferToPiggyModal(\''+sp.name+'\','+reviewYear+','+spBalance+')">转入储蓄罐（结余 ¥'+formatMoney(spBalance)+'）</div>';
    }
    cardsHtml += '</div>';
  }
  $('reviewSpecialCards').innerHTML = cardsHtml;

  if (assetsPanelOpen) renderAssetsPanel();
}

function editMonthAdjust(m0) {
  var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var current = getBudgetForYear(reviewYear).monthlyAdjust[m0] || 0;
  openModalShell({id:'monthAdjustOverlay', title:monthNames[m0]+' 预算微调', ok:'保存', okFn:'saveSingleAdjust('+m0+')', body:

// ============ ANNUAL REVIEW ============
// 依赖: appData.records/budgetByYear(DATA), formatMoney/getBudgetForYear/convertToCNY(UTILS),
//        REVIEW_GROUPS(MONTHLY REVIEW), getAnnualCatData(MONTHLY REVIEW),
//        drawBarChart/drawLineChart(CANVAS CHARTS), switchTab(TAB SWITCH)
// 暴露: showAnnualReview(), closeAnnualReview(), renderAnnualReview()
function showAnnualReview() {
  var pages = document.querySelectorAll('.page');
  for (var i=0;i<pages.length;i++) { pages[i].classList.remove('active'); }

function renderAnnualReview() {
  // 确定年份范围：最早有记录的年 ~ 当前年
  var curYear = new Date().getFullYear();
  var minYear = curYear;
  for (var ri=0; ri<appData.records.length; ri++) {
    var d = appData.records[ri].date;
    if (d) { var y = parseInt(d.slice(0,4)); if (!isNaN(y) && y < minYear) minYear = y; }
  }
  var years = [];
  for (var yr=minYear; yr<=curYear; yr++) years.push(yr);

  // 复用月度复盘的grpClasses和colGroupStart
  var grpClasses = [];
  var colGroupStart = [];
  for (var gpi=0; gpi<REVIEW_GROUPS.length; gpi++) {
    var gname = REVIEW_GROUPS[gpi].label;
    var cls = gname==='居住' ? 'mr-grp-blue' : (gname==='饮食' ? 'mr-grp-dark' : ((gpi%2===0)?'mr-grp-light':'mr-grp-dark'));
    for (var gci=0; gci<REVIEW_GROUPS[gpi].cols.length; gci++) {
      grpClasses.push(cls);
      colGroupStart.push(gci===0);
    }
  }

  var html = '<table class="mr-table"><thead>';

  // Header row 1: 年份 | 年预算 | [分类组] | 基本开销合计 | 专项(colspan=5) | 总合计 | 余额
  html += '<tr>';
  html += '<th rowspan="2" class="mr-sticky-l0">年份</th>';
  html += '<th rowspan="2" class="mr-sticky-l1">年预算</th>';
  var h1offset = 0;
  for (var gi=0; gi<REVIEW_GROUPS.length; gi++) {
    var g = REVIEW_GROUPS[gi];
    html += '<th colspan="'+g.cols.length+'" class="'+grpClasses[h1offset]+' mr-grp-start">'+escHtml(g.label)+'</th>';
    h1offset += g.cols.length;
  }
  html += '<th rowspan="2" class="mr-col-total">年度基本<br>开销合计</th>';
  html += '<th colspan="'+(ANNUAL_SPECIAL_COLS.length+1)+'" class="mr-grp-blue mr-grp-start">专项</th>';
  html += '<th rowspan="2" class="mr-col-total">总合计</th>';
  html += '<th rowspan="2" class="mr-sticky-r1">余额</th>';
  html += '</tr>';

  // Header row 2: 各列小标题
  html += '<tr>';
  var h2offset = 0;
  for (var gi2=0; gi2<REVIEW_GROUPS.length; gi2++) {
    var g2 = REVIEW_GROUPS[gi2];
    for (var ci5=0; ci5<g2.cols.length; ci5++) {
      var lbl = g2.cols.length>1 ? g2.cols[ci5].label : '';
      html += '<th class="'+grpClasses[h2offset]+(ci5===0?' mr-grp-start':'')+'">'+escHtml(lbl)+'</th>';
      h2offset++;
    }
  }
  for (var sci=0; sci<ANNUAL_SPECIAL_COLS.length; sci++) {
    html += '<th class="mr-grp-blue'+(sci===0?' mr-grp-start':'')+'">'+escHtml(ANNUAL_SPECIAL_COLS[sci].label)+'</th>';
  }
  html += '<th class="mr-grp-blue">专项合计</th>';
  html += '</tr></thead><tbody>';

  // 数据行：每年一行
  for (var yi=0; yi<years.length; yi++) {
    var year = years[yi];
    var ys = year+'-01-01', ye=(year+1)+'-01-01';
    var b = getBudgetForYear(year);
    var yearBudget = b.total || 0;
    var ov = appData.annualOverride[year] || {};

    // 日常分类：有覆盖值用覆盖值，否则从记录计算
    var colVals = [], basicTotal = 0;
    for (var ci=0; ci<REVIEW_COLS.length; ci++) {
      var key = 'col_'+ci;
      var v = (ov[key] !== undefined) ? ov[key] : sumCatForRange(ys, ye, REVIEW_COLS[ci].path);
      colVals.push(v);
      basicTotal += v;
    }

    // 专项：有覆盖值用覆盖值，否则从记录计算
    var specialVals = [], specialTotal = 0;
    for (var si=0; si<ANNUAL_SPECIAL_COLS.length; si++) {
      var skey = 'sp_'+si;
      var sv = (ov[skey] !== undefined) ? ov[skey] : ANNUAL_SPECIAL_COLS[si].getData(year);
      specialVals.push(sv);
      specialTotal += sv;
    }

    var grandTotal = basicTotal + specialTotal;
    var balance = yearBudget - grandTotal;
    var isCur = (year === curYear);
    var hasOv = Object.keys(ov).length > 0;
    html += '<tr'+(isCur?' class="mr-current"':'')+'>';
    // 年份单元格：可点击进入编辑
    html += '<td class="mr-sticky-l0" style="cursor:pointer;user-select:none;" onclick="editAnnualRow('+year+')" title="点击编辑该年数据">'+year+(isCur?' (今年)':'')+(hasOv?' ✏':'')+'</td>';
    html += '<td class="mr-sticky-l1" style="text-align:center;">'+fmtBudgetCell(yearBudget)+'</td>';
    for (var ci2=0; ci2<REVIEW_COLS.length; ci2++) {
      html += '<td style="text-align:center;"'+(colGroupStart[ci2]?' class="mr-grp-start"':'')+'>'+fmtCell(colVals[ci2])+'</td>';
    }
    html += '<td class="mr-col-total" style="text-align:center;">'+fmtCell(basicTotal)+'</td>';
    for (var si2=0; si2<ANNUAL_SPECIAL_COLS.length; si2++) {
      html += '<td style="text-align:center;" class="'+(si2===0?'mr-grp-start ':'')+'mr-grp-blue">'+fmtCell(specialVals[si2])+'</td>';
    }
    html += '<td class="mr-grp-blue" style="text-align:center;">'+fmtCell(specialTotal)+'</td>';
    html += '<td class="mr-col-total" style="text-align:center;">'+fmtCell(grandTotal)+'</td>';
    var balClass = balance>=0 ? ' mr-balance-pos' : ' mr-balance-neg';
    html += '<td class="mr-sticky-r1'+balClass+'" style="text-align:center;">'+formatMoney(balance)+'</td>';
    html += '</tr>';
  }

  html += '</tbody></table>';
  $('annualTableScroll').innerHTML = html;
}

function editAnnualRow(year) {
  var ov = appData.annualOverride[year] || {};
  var ys = year+'-01-01', ye=(year+1)+'-01-01';
  var fields = [];
  // 日常分类
  for (var ci=0; ci<REVIEW_COLS.length; ci++) {
    var key = 'col_'+ci;
    var cur = (ov[key] !== undefined) ? ov[key] : sumCatForRange(ys, ye, REVIEW_COLS[ci].path);
    fields.push({ key:key, label:REVIEW_COLS[ci].label||REVIEW_COLS[ci].path[REVIEW_COLS[ci].path.length-1], val:cur });
  }
  // 专项
  for (var si=0; si<ANNUAL_SPECIAL_COLS.length; si++) {
    var skey = 'sp_'+si;
    var scur = (ov[skey] !== undefined) ? ov[skey] : ANNUAL_SPECIAL_COLS[si].getData(year);
    fields.push({ key:skey, label:ANNUAL_SPECIAL_COLS[si].label, val:scur });
  }

  var inputsHtml = '';
  for (var fi=0; fi<fields.length; fi++) {
    inputsHtml += '<div class="form-row"><label>'+escHtml(fields[fi].label)+'</label>' +
      '<input type="number" id="annualOv_'+fields[fi].key+'" value="'+(fields[fi].val||0)+'" step="any" min="0"></div>';
  }

  openModalShell({id:'annualEditOverlay', title:'编辑 '+year+' 年数据', style:'max-height:85vh;overflow-y:auto;',
    footer:'<button class="btn btn-outline" onclick="clearAnnualOverride('+year+')">清除覆盖</button>' +
      '<button class="btn btn-outline" onclick="closeModal(this)">取消</button>' +
      '<button class="btn btn-primary" onclick="saveAnnualRow('+year+')">保存</button>', body:
    '<div style="font-size:var(--fs-12);color:var(--text2);margin-bottom:12px;">填写后将覆盖该年自动统计值。清空某项并保存则恢复自动统计。</div>' +
    '<div class="mr-monthly-adjust-grid">'+inputsHtml+'</div>'});

function saveAnnualRow(year) {
  if (!appData.annualOverride) appData.annualOverride = {};
  var ov = {};
  for (var ci=0; ci<REVIEW_COLS.length; ci++) {
    var el = $('annualOv_col_'+ci);

// ============ CANVAS CHARTS ============
// 依赖: (无外部依赖，纯绘图工具)
// 暴露: deferDraw(fn), drawBarChart(canvasId, data, opts), drawLineChart(canvasId, data, opts)
// 注意: deferDraw用于解决手机端canvas尺寸读取时机问题，所有图表绘制必须包在deferDraw内
function deferDraw(fn) {
  // 确保浏览器已完成本次DOM更新的布局计算后再读取canvas尺寸并绘图，
  // 避免手机端因渲染时机不同导致clientWidth读取过早、图表错位的问题
  requestAnimationFrame(function() {
    requestAnimationFrame(fn);
  });
}

function setupHiDpiCanvas(canvas) {
  // 使用canvas在页面上的实际CSS显示尺寸（而非写死的width/height属性）作为绘图坐标系基准，
  // 内部像素分辨率按设备像素比放大，避免高分屏模糊；同时所有绘图坐标都用cssW/cssH计算，
  // 避免不同屏幕宽度下的拉伸错位
  var dpr = window.devicePixelRatio || 1;
  var cssW = canvas.clientWidth || parseInt(canvas.getAttribute('width'), 10) || 300;
  var cssH = canvas.clientHeight || parseInt(canvas.getAttribute('height'), 10) || 200;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx: ctx, w: cssW, h: cssH };
}

function drawRing(canvasId, pct, color, bgColor) {
  var canvas = $(canvasId);
  if (!canvas) return;
  var setup = setupHiDpiCanvas(canvas);
  var ctx = setup.ctx, w = setup.w, h = setup.h;
  var cx = w/2, cy = h/2, r = 49, lw = 11;
  ctx.clearRect(0,0,w,h);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.strokeStyle=bgColor; ctx.lineWidth=lw; ctx.stroke();
  if (pct > 0) {
    var angle = Math.min(pct, 100) / 100 * Math.PI * 2;
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+angle); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.stroke();
  }
  ctx.fillStyle='#2C3E50'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(Math.round(pct)+'%', cx, cy);
}

function drawBarChart(canvasId, labels, values, colors) {
  var canvas = $(canvasId);
  if (!canvas) return;
  var setup = setupHiDpiCanvas(canvas);
  var ctx = setup.ctx, w = setup.w, h = setup.h;
  var pad = { top:20, right:20, bottom:30, left:20 };
  var cw = w - pad.left - pad.right, ch = h - pad.top - pad.bottom;
  ctx.clearRect(0,0,w,h);
  var maxV = Math.max.apply(null, values.concat([100]));
  var barW = cw / labels.length * 0.6;
  var gap = cw / labels.length;
  ctx.strokeStyle='#eee'; ctx.lineWidth=1;
  for (var i=0;i<=4;i++) {
    var y = pad.top + ch * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w-pad.right, y); ctx.stroke();
  }
  for (var vi=0;vi<values.length;vi++) {
    var x = pad.left + gap * vi + gap/2 - barW/2;
    var bh = Math.max(values[vi]/maxV*ch, 0);
    var by = pad.top + ch - bh;
    ctx.fillStyle = colors[vi] || '#4A90D9';
    ctx.fillRect(x, by, barW, bh);
    ctx.fillStyle='#2C3E50'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('¥'+(values[vi]/1000).toFixed(1)+'k', x+barW/2, by-6);
    ctx.fillText(labels[vi], x+barW/2, pad.top+ch+16);
  }
}

function drawPieChart(canvasId, items) {
  var canvas = $(canvasId);
  if (!canvas) return;
  var setup = setupHiDpiCanvas(canvas);
  var ctx = setup.ctx, w = setup.w, h = setup.h;
  var cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 4;
  ctx.clearRect(0,0,w,h);
  var total = 0;
  for (var i=0;i<items.length;i++) { total += items[i].value; }
  if (total === 0) {
    ctx.fillStyle='#ccc'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('暂无数据',cx,cy);
    return;
  }
  var angle = -Math.PI/2;
  for (var j=0;j<items.length;j++) {
    var slice = items[j].value/total * Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.fillStyle = items[j].color; ctx.fill();
    angle += slice;
  }
}

// ============ TRAVEL TAB ============
// 依赖: appData.trips/records(DATA), saveData(DATA), formatMoney/getTripSpent/convertToCNY(UTILS),

// 暴露: selectTrip(), renderTravel(), showAddTripModal(), showTripActionMenu()

function selectTrip(tripId) {
  var sel = $('tripSelect');
  if (sel) { sel.value = tripId; }
  renderTravel();
}

function renderTravel() {
  var sel = $('tripSelect');
  if (!sel) return;
  var savedVal = sel.value;
  var opts = '<option value="">-- 选择行程 --</option>';
  for (var i=0;i<appData.trips.length;i++) {
    opts += '<option value="' + appData.trips[i].id + '">' + escHtml(appData.trips[i].name) + '</option>';
  }
  sel.innerHTML = opts;
  sel.value = savedVal;
  var tripId = sel.value;
  if (!tripId) {
    if (appData.trips.length > 0) {
      var sortedTrips = appData.trips.slice().sort(function(a,b){ return (b.startDate||'').localeCompare(a.startDate||''); });
      // Group by year
      var yearGroups = {};
      for (var si=0; si<sortedTrips.length; si++) {
        var st = sortedTrips[si];
        var yr = (st.startDate||'').substring(0,4) || '未知年份';
        if (!yearGroups[yr]) yearGroups[yr] = [];
        yearGroups[yr].push(st);
      }
      var years = Object.keys(yearGroups).sort(function(a,b){ return b.localeCompare(a); });
      var html = '';
      var ringTasks = [];
      for (var yi=0; yi<years.length; yi++) {
        var year = years[yi];
        var yearTotal = 0;
        for (var yti=0; yti<yearGroups[year].length; yti++) { yearTotal += getTripSpent(yearGroups[year][yti].id); }
        html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;padding-left:4px;">' +
          '<span style="font-size:var(--fs-13);font-weight:600;color:var(--text);">' + year + '年</span>' +
          '<span style="font-size:var(--fs-12);color:var(--danger);font-weight:500;">支出 &yen;' + formatMoney(yearTotal) + '</span></div>';
        var trips = yearGroups[year];
        for (var ti=0; ti<trips.length; ti++) {
          var t = trips[ti];
          var spent = getTripSpent(t.id);
          var pct = t.totalBudget > 0 ? Math.min(spent / t.totalBudget * 100, 150) : 0;
          var canvasId = 'tripRing_' + t.id;
          html += '<div class="card" style="cursor:pointer;" onclick="selectTrip(\'' + t.id + '\')">' +
            '<div class="section-title">' + escHtml(t.name) + '</div>' +
            '<div style="font-size:var(--fs-12);color:var(--text2);margin-bottom:8px;">' + (t.startDate||'') + ' ~ ' + (t.endDate||'') + '</div>' +
            '<div class="ring-container">' +
            '<canvas id="' + canvasId + '" class="ring-canvas" width="128" height="128"></canvas>' +
            '<div class="ring-info">' +
            '<div class="ring-label">已花费</div>' +
            '<div class="ring-amount">&yen;' + formatMoney(spent) + '</div>' +
            '<div class="ring-pct" style="color:' + (pct>100?'var(--danger)':'var(--text2)') + '">' + pct.toFixed(1) + '% / &yen;' + formatMoney(t.totalBudget) + '</div>' +
            '</div></div>' +
            '<div style="text-align:center;color:var(--text2);font-size:var(--fs-12);margin-top:8px;">点击查看详情</div>' +
            '</div>';
          ringTasks.push({id:canvasId, pct:pct, color:pct>100?'#E74C3C':'#4A90D9'});
        }
      }
      $('trip-content').innerHTML = html;
      deferDraw(function(){
        for (var ri=0; ri<ringTasks.length; ri++) {
          drawRing(ringTasks[ri].id, ringTasks[ri].pct, ringTasks[ri].color, '#E8ECF1');
        }
      });
    } else {
      $('trip-content').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">暂无行程，请新建</div>';
    }
    return;
  }
  var trip = getTripById(tripId);
  if (!trip) return;
  var tripSpent = getTripSpent(tripId);
  var tPct = trip.totalBudget > 0 ? Math.min(tripSpent / trip.totalBudget * 100, 150) : 0;

  var html = '<div class="card">' +
    '<div class="section-title">' + escHtml(trip.name) + '<span class="cat-more" onclick="event.stopPropagation();showTripActionMenu(\'' + trip.id + '\')">···</span></div>' +
    '<div style="font-size:var(--fs-12);color:var(--text2);margin-bottom:8px;">' + (trip.startDate||'') + ' ~ ' + (trip.endDate||'') + '</div>' +
    '<button class="btn btn-outline btn-sm" style="width:100%;margin-bottom:10px;" onclick="showTripReview()">📊 复盘看板</button>' +
    '<div class="ring-container">' +
    '<canvas id="tripRing" class="ring-canvas" width="128" height="128"></canvas>' +
    '<div class="ring-info">' +
    '<div class="ring-label">已花费</div>' +
    '<div class="ring-amount">&yen;' + formatMoney(tripSpent) + '</div>' +
    '<div class="ring-pct" style="color:' + (tPct>100?'var(--danger)':'var(--text2)') + '">' + tPct.toFixed(1) + '% / &yen;' + formatMoney(trip.totalBudget) + '</div>' +
    '</div></div></div>';

  var now = new Date();
  if (!calYear) { calYear = now.getFullYear(); calMonth = now.getMonth(); }
  html += '<div class="card"><div class="cal-header">' +
    '<button onclick="changeCalMonth(-1)">◀</button>' +
    '<span class="cal-title">' + calYear + '年' + (calMonth+1) + '月</span>' +
    '<button onclick="changeCalMonth(1)">▶</button></div>' +
    '<div class="cal-grid">';
  var dayHeaders = ['一','二','三','四','五','六','日'];
  for (var dh=0;dh<dayHeaders.length;dh++) { html += '<div class="cal-day-header">' + dayHeaders[dh] + '</div>'; }
  var rawFirstDay = new Date(calYear, calMonth, 1).getDay();
  var firstDay = (rawFirstDay + 6) % 7; // 转换为周一=0...周日=6
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  for (var ei=0;ei<firstDay;ei++) html += '<div class="cal-day other-month"></div>';
  for (var d=1;d<=daysInMonth;d++) {
    var pd = (calMonth<9?'0':'') + (calMonth+1);
    var dd = (d<10?'0':'') + d;
    var dateStr = calYear + '-' + pd + '-' + dd;
    var hasNodes = false;
    if (trip.dayNodes) {
      for (var ni=0;ni<trip.dayNodes.length;ni++) { if (trip.dayNodes[ni].date===dateStr) { hasNodes=true; break; } }
    }
    var isToday = dateStr === todayStr();
    var isSel = dateStr === calSelectedDate;
    html += '<div class="cal-day' + (hasNodes?' has-nodes':'') + (isToday?' today':'') + (isSel?' selected':'') + '" onclick="selectCalDate(\'' + dateStr + '\')">' + d + '</div>';
  }
  html += '</div></div>';

  if (calSelectedDate) {
    var nodes = [];
    if (trip.dayNodes) {
      for (var nni=0;nni<trip.dayNodes.length;nni++) {
        if (trip.dayNodes[nni].date===calSelectedDate) nodes.push(trip.dayNodes[nni]);
      }
    }
    html += '<div class="card"><div class="section-title">' + calSelectedDate + ' 行程</div>';
    if (nodes.length===0) html += '<div style="color:var(--text2);font-size:var(--fs-13);text-align:center;padding:10px;">暂无行程安排</div>';
    else {
      for (var nd=0;nd<nodes.length;nd++) {
        var ndn = nodes[nd];
        html += '<div class="day-node-card" onclick="event.stopPropagation();showNodeActionMenu(\'' + trip.id + '\',\'' + ndn.id + '\')">' +
          '<div class="node-info"><div class="node-time">' + escHtml(ndn.time||'') + '</div><div class="node-loc">' + escHtml(ndn.location||'') + '</div><div class="node-note">' + escHtml(ndn.note||'') + '</div></div></div>';
      }
    }
    html += '<button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px;" onclick="showDayNodeModal()">+ 添加行程节点</button></div>';
  }

  // Trip expenses
  var tripExpenses = [];
  for (var ei=0; ei<appData.records.length; ei++) {
    if (appData.records[ei].tripId===tripId && appData.records[ei].recordType==='expense') tripExpenses.push(appData.records[ei]);
  }
  tripExpenses.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  html += '<div class="card"><div class="section-title">行程费用<button class="btn btn-outline btn-sm" onclick="showTripExpenseModal()">+ 添加</button></div>';
  if (tripExpenses.length===0) {
    html += '<div style="color:var(--text2);font-size:var(--fs-13);text-align:center;padding:10px;">暂无费用记录</div>';
  } else {
    var expGroups = {};
    for (var egi=0; egi<tripExpenses.length; egi++) {
      var ger = tripExpenses[egi];
      if (!expGroups[ger.date]) expGroups[ger.date] = { records: [], dayExpense: 0 };
      expGroups[ger.date].records.push(ger);
      expGroups[ger.date].dayExpense += getRmbAmt(ger);
    }
    var expDates = Object.keys(expGroups).sort(function(a,b){ return b.localeCompare(a); });
    for (var edi=0; edi<expDates.length; edi++) {
      var edate = expDates[edi];
      var eg = expGroups[edate];
      var eCollapsed = !collapsedTripDates[tripId] || !collapsedTripDates[tripId][edate];
      html += '<div class="date-group">' +
        '<div class="date-group-header'+(eCollapsed?' collapsed':'')+'" onclick="toggleTripDate(\''+tripId+'\',\''+edate+'\')">' +
          '<span>'+(edate||'')+'</span>' +
          '<span class="day-sum">支出 ¥'+formatMoney(eg.dayExpense)+'</span>' +
        '</div>' +
        '<div class="date-group-body'+(eCollapsed?' collapsed':'')+'">';
      for (var ei=0; ei<eg.records.length; ei++) {
        var exp = eg.records[ei];
        var catName = exp.catPath ? exp.catPath.join(' > ') : '';
        var expRmb = getRmbAmt(exp);
        var expSub = '';
        var expOrig = '';
        if (exp.originalAmount > 0) {
          expOrig = '<div class="txt-hint">原币金额: ' + escHtml(exp.originalCurrency||'') + ' ' + formatMoney(exp.originalAmount) + '</div>';
        }
        if (exp.amountForeign > 0 && exp.currency) {
          expSub = '<div class="txt-hint">实付: ' + escHtml(exp.currency) + ' ' + formatMoney(exp.amountForeign) + ' × ' + (exp.exchangeRate||'?') + '</div>';
        } else if (!exp.amountForeign && exp.currency && exp.currency !== 'CNY' && exp.amountCNY !== undefined) {
          expSub = '<div class="txt-hint">实付: ' + escHtml(exp.currency) + ' ' + formatMoney(exp.amount||0) + '</div>';
        }
        var expSplit = '';
        if (exp.payee && exp.peopleCount > 1) {
          expSplit = '<div style="font-size:var(--fs-11);color:var(--primary);">' + escHtml(exp.payee) + ' ÷' + exp.peopleCount + '人</div>';
        } else if (exp.payee) {
          expSplit = '<div style="font-size:var(--fs-11);color:var(--primary);">' + escHtml(exp.payee) + '</div>';
        }
        html += '<div class="expense-row" onclick="showRecordAction(\'' + exp.id + '\')"><div>' +
          '<div style="font-size:var(--fs-13);">' + escHtml(catName) + '</div>' +
          (exp.note?'<div class="txt-hint">'+escHtml(exp.note)+'</div>':'') + '</div>' +
          '<div style="text-align:right;"><div style="font-weight:600;color:var(--danger);">&yen;' + formatMoney(expRmb) + '</div>' + expOrig + expSub + expSplit + '</div></div>';
      }
      html += '</div></div>';
    }
  }
  html += '</div>';

  html += '<button class="btn btn-outline" style="width:100%;margin-top:10px;color:var(--danger);border-color:var(--danger);" onclick="showSettlementModal()">结账转入日常</button>';
  $('trip-content').innerHTML = html;
  deferDraw(function(){ drawRing('tripRing', tPct, tPct>100?'#E74C3C':'#4A90D9','#E8ECF1'); });
}

function changeCalMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderTravel();
}

function selectCalDate(dateStr) {
  calSelectedDate = calSelectedDate === dateStr ? null : dateStr;
  renderTravel();
}

function toggleTripDate(tripId, date) {
  if (!collapsedTripDates[tripId]) collapsedTripDates[tripId] = {};
  if (collapsedTripDates[tripId][date]) {
    delete collapsedTripDates[tripId][date];
  } else {
    collapsedTripDates[tripId][date] = true;
  }
  renderTravel();
}

function onTripPayeeChange() {
  var payeeVal = ($('tripExpPayee').value||'').trim();
  var wrap = document.getElementById('tripExpPeopleWrap');
  if (wrap) {
    if (payeeVal) { wrap.style.display = ''; }
    else { wrap.style.display = 'none'; $('tripExpPeople').value = '1'; }
  }
  var hint = $('tripExpSplitHint');
  if (!hint) return;
  var amt = parseFloat($('tripExpAmt').value) || 0;
  var count = payeeVal ? (parseInt($('tripExpPeople').value) || 1) : 1;
  if (payeeVal && count > 1 && amt > 0) {
    hint.textContent = '人均 ¥' + formatMoney(amt / count);
    hint.style.display = '';
  } else {
    hint.style.display = 'none';
  }
}
function autoCalcTripRmb() {
  var foreign = parseFloat($('tripExpForeign').value) || 0;
  var rate = parseFloat($('tripExpRate').value) || 0;
  if (foreign > 0 && rate > 0) { $('tripExpAmt').value = (foreign * rate).toFixed(2); }
  onTripPayeeChange();
}
function fetchRealtimeRateForTrip() {
  var currency = ($('tripExpCurrency').value||'').trim().toUpperCase();
  if (!currency) { toast('请先填写实付币种', true); return; }
  if (currency === 'CNY') { $('tripExpRate').value = '1'; autoCalcTripRmb(); return; }
  var rate = appData.rates[currency];
  if (rate && rate > 0) {
    $('tripExpRate').value = (1 / rate).toFixed(6);
    autoCalcTripRmb();
  } else {
    toast('未找到 ' + currency + ' 的汇率，请在汇率管理中补充', true);
  }
}
function saveTripExpense(tripId) {
  var catName = $('tripExpCat').value;
  var amt = parseFloat($('tripExpAmt').value);
  if (!catName || !amt || amt<=0) return toast('请选择类别并输入金额', true);
  var dateVal = $('tripExpDate').value;
  if (!dateVal) return toast('请选择日期', true);
  var orgAmt = parseFloat($('tripExpOrigAmt').value) || 0;
  var orgCur = ($('tripExpOrigCurrency').value||'').trim().toUpperCase();
  var foreign = parseFloat($('tripExpForeign').value) || 0;
  var currency = ($('tripExpCurrency').value||'').trim().toUpperCase();
  var rate = parseFloat($('tripExpRate').value) || 0;
  var payee = ($('tripExpPayee').value||'').trim();
  var peopleCount = payee ? (parseInt($('tripExpPeople').value) || 1) : 1;
  var payment = ($('tripExpPayment').value||'').trim();
  appData.records.push({
    id: genId(), type:'travel', catPath:[catName], amount:amt, originalAmount:orgAmt, originalCurrency:orgCur, currency:currency, amountForeign:foreign, exchangeRate:rate,
    date: dateVal, recordType:'expense', note: $('tripExpNote').value.trim(), tripId:tripId,
    payee: payee, peopleCount: peopleCount, paymentMethod: payment
  });
  var tripObj = getTripById(tripId);
  var outOfRange = tripObj && ((tripObj.startDate && dateVal < tripObj.startDate) || (tripObj.endDate && dateVal > tripObj.endDate));
  saveData(); toast(outOfRange ? '已新增（日期不在行程范围内）' : '已新增');
  closeAllModals();
  renderTravel();
}
function doSettlement(tripId) {

  });

}

// ============ TRIP REVIEW ============
// 依赖: appData.trips/records(DATA), formatMoney/getTripSpent/convertToCNY(UTILS),
//        drawBarChart(CANVAS CHARTS), switchTab(TAB SWITCH)
// 暴露: showTripReview(), closeTripReview(), renderTripReview()
function showTripReview() {
  var selTripId = $('tripSelect').value;
  if (!selTripId) return;
  var trip = getTripById(selTripId);
  if (!trip) return;
  closeAllModals();

  // Collect trip expenses
  var expenses = [];
  var total = 0;
  for (var ri=0;ri<appData.records.length;ri++) {
    var r = appData.records[ri];
    if (r.tripId!==selTripId || r.recordType!=='expense') continue;
    var amt = getRmbAmt(r);
    total += amt;
    expenses.push({ record: r, amt: amt });
  }

  var reviewView = 'cat'; // default view

  function buildReviewContent() {
    var pct = trip.totalBudget>0 ? Math.min(total/trip.totalBudget*100, 100) : 0;
    var barColor = pct>=100 ? 'var(--danger)' : (pct>=80 ? '#f0ad4e' : 'var(--primary)');

    var inner = '<div class="review-tabs">' +
      '<div class="review-tab'+(reviewView==='cat'?' active':'')+'" onclick="_reviewSwitchView(\'cat\')">按分类</div>' +
      '<div class="review-tab'+(reviewView==='payee'?' active':'')+'" onclick="_reviewSwitchView(\'payee\')">按支付人</div>' +
    '</div>';

    if (reviewView === 'cat') {
      inner += buildCatView();
    } else {
      inner += buildPayeeView();
    }

    return inner;
  }

  function buildCatView() {
    var l1Map = {};
    for (var ei=0;ei<expenses.length;ei++) {
      var e = expenses[ei];
      var cp = e.record.catPath || [];
      var l1 = cp[0] || '未分类';
      var l2 = cp[1] || '';
      if (!l1Map[l1]) l1Map[l1] = { total:0, items:{} };
      l1Map[l1].total += e.amt;
      if (l2) { l1Map[l1].items[l2] = (l1Map[l1].items[l2]||0) + e.amt; }
    }
    var l1List = Object.keys(l1Map).sort(function(a,b){ return l1Map[b].total - l1Map[a].total; });
    var html = '';
    for (var li=0;li<l1List.length;li++) {
      var l1Name = l1List[li];
      var l1Total = l1Map[l1Name].total;
      var l1Pct = total>0 ? l1Total/total*100 : 0;
      var l2Keys = Object.keys(l1Map[l1Name].items).sort(function(a,b){ return l1Map[l1Name].items[b] - l1Map[l1Name].items[a]; });
      var l1BarW = Math.max(l1Pct, 2);
      html += '<div class="review-l1" onclick="var n=this.nextElementSibling;n.style.display=n.style.display===\'none\'?\'block\':\'none\'">' +
        '<span class="review-l1-name">' + escHtml(l1Name) + '</span>' +
        '<div class="review-bar-wrap"><div class="review-bar-fill" style="width:'+l1BarW+'%"></div></div>' +
        '<span class="review-l1-amt">¥' + formatMoney(l1Total) + '</span>' +
        '<span class="review-l1-pct">' + l1Pct.toFixed(1) + '%</span></div>';
      if (l2Keys.length>0) {
        html += '<div class="review-l2-block" style="display:none;">';
        for (var l2i=0;l2i<l2Keys.length;l2i++) {
          var l2Name = l2Keys[l2i];
          var l2Amt = l1Map[l1Name].items[l2Name];
          var l2Pct = total>0 ? l2Amt/total*100 : 0;
          var l2BarW = Math.max(l2Pct, 1);
          html += '<div class="review-l2">' +
            '<span class="review-l2-name">├ ' + escHtml(l2Name) + '</span>' +
            '<div class="review-bar-wrap" style="height:6px;"><div class="review-bar-fill" style="width:'+l2BarW+'%"></div></div>' +
            '<span class="review-l2-amt">¥' + formatMoney(l2Amt) + '</span>' +
            '<span class="review-l2-pct">' + l2Pct.toFixed(1) + '%</span></div>';
        }
        html += '</div>';
      }
    }
    return html;
  }

  function buildPayeeView() {
    var payeeMap = {};
    var payeeRawMap = {};
    var myTotal = 0;
    for (var ei=0;ei<expenses.length;ei++) {
      var e = expenses[ei];
      if (e.record.payee) {
        var payee = e.record.payee;
        if (!payeeMap[payee]) { payeeMap[payee] = 0; payeeRawMap[payee] = 0; }
        payeeMap[payee] += e.amt;
        var pc = e.record.peopleCount || 1;
        payeeRawMap[payee] += pc > 1 ? e.amt * pc : e.amt;
      } else {
        myTotal += e.amt;
      }
    }
    var payeeList = Object.keys(payeeMap).sort(function(a,b){ return payeeMap[b] - payeeMap[a]; });
    var aaTotal = 0;
    var rawTotalSum = 0;
    for (var pi=0;pi<payeeList.length;pi++) {
      aaTotal += payeeMap[payeeList[pi]];
      rawTotalSum += payeeRawMap[payeeList[pi]];
    }
    var aaCount = payeeList.length;
    var perPerson = aaCount > 0 ? rawTotalSum / aaCount : 0;

    var html = '';
    // 我自己（置顶）
    if (myTotal > 0) {
      var myPct = total>0 ? myTotal/total*100 : 0;
      html += '<div class="review-l1">' +
        '<span class="review-l1-name" style="color:var(--text2);">我自己</span>' +
        '<div class="review-bar-wrap"><div class="review-bar-fill" style="width:'+Math.max(myPct,2)+'%;background:#ccc;"></div></div>' +
        '<span class="review-l1-amt" style="color:var(--text2);">¥' + formatMoney(myTotal) + '</span>' +
        '<span class="review-l1-pct">' + myPct.toFixed(1) + '%</span></div>';
    }
    // 支付人列表
    for (var pi=0;pi<payeeList.length;pi++) {
      var pName = payeeList[pi];
      var pTotal = payeeMap[pName];
      var pPct = aaTotal>0 ? pTotal/aaTotal*100 : 0;
      var pBarW = Math.max(pPct, 2);
      html += '<div class="review-l1">' +
        '<span class="review-l1-name">' + escHtml(pName) + '</span>' +
        '<div class="review-bar-wrap"><div class="review-bar-fill" style="width:'+pBarW+'%"></div></div>' +
        '<span class="review-l1-amt">¥' + formatMoney(pTotal) + '</span>' +
        '<span class="review-l1-pct">' + pPct.toFixed(1) + '%</span></div>';
    }
    // AA 平账区
    if (aaCount >= 2) {
      // 计算过程
      var calcParts = [];
      for (var ci=0;ci<payeeList.length;ci++) {
        calcParts.push('¥' + formatMoney(payeeMap[payeeList[ci]]));
      }
      html += '<div style="margin-top:14px;padding-top:12px;border-top:2px solid var(--border);">' +
        '<div style="font-size:var(--fs-12);color:var(--text2);line-height:1.8;">' +
          '<div>分摊前总花费：' + calcParts.join(' + ') + ' = <b>¥' + formatMoney(aaTotal) + '</b>  × ' + aaCount + '人 = <b style="color:var(--text);">¥' + formatMoney(rawTotalSum) + '</b></div>' +
          '<div>人均应付：' + formatMoney(rawTotalSum) + ' ÷ ' + aaCount + ' = <b style="color:var(--primary);">¥' + formatMoney(perPerson) + '</b></div>' +
        '</div>';
      // 差额明细
      html += '<div style="margin-top:10px;padding:10px;background:#f9fafb;border-radius:var(--r-sm);font-size:var(--fs-12);line-height:1.9;">';
      for (var di=0;di<payeeList.length;di++) {
        var dn = payeeList[di];
        var pTotal = payeeMap[dn];
        var rawTotal = payeeRawMap[dn];
        var diff = rawTotal - perPerson;
        var sign = diff >= 0 ? '+' : '';
        var color = diff >= 0 ? 'var(--success)' : 'var(--danger)';
        var label = diff >= 0 ? '多付' : '少付';
        html += '<div style="display:flex;justify-content:space-between;">' +
          '<span>' + escHtml(dn) + ' 垫付 ¥' + formatMoney(pTotal) + ' × ' + aaCount + ' = <b>¥' + formatMoney(rawTotal) + '</b></span>' +
          '<span style="color:' + color + ';">' + label + ' ' + sign + '¥' + formatMoney(Math.abs(diff)) + '</span></div>';
      }
      html += '</div>';
    }
    return html;
  }

  var pct = trip.totalBudget>0 ? Math.min(total/trip.totalBudget*100, 100) : 0;
  var barColor = pct>=100 ? 'var(--danger)' : (pct>=80 ? '#f0ad4e' : 'var(--primary)');

  openModalShell({id:'reviewOverlay', sheetId:'reviewSheet', style:'max-height:85vh;overflow-y:auto;', titleStyle:'margin-bottom:2px;',

// ============ RECORDS TAB ============
// 依赖: appData.records/trips/rates(DATA), saveData(DATA),
//        formatMoney/convertToCNY/getTripById/escHtml(UTILS),
//        openModal/closeAllModals(MODAL), rcCalYear/rcCalMonth/recordViewMode/recordMonth(STATE),
//        refreshTemplateFab(TEMPLATES)
// 暴露: renderRecords(), showRecordModal(editId?, tpl?), saveRecord(), saveEditRecord(editId),
//        fetchRealtimeRate(), autoCalcRmb(), onAmountInput(), onAmountBlur(), getRmbAmt(record)
// 注意: getRmbAmt()虽定义在本块，但被UTILS/DAILY TAB/PIGGY BANK等多处跨块调用
function renderRecords() {
  if (rcCalYear === null) {
    var now = new Date();
    rcCalYear = now.getFullYear();
    rcCalMonth = now.getMonth() - 1;
    if (rcCalMonth < 0) { rcCalMonth = 11; rcCalYear--; }
  }
  renderRecordsCalendar();
}

function parseAmountExpr(str) {
  if (!str || str === '') return 0;
  str = String(str).trim();
  // 只含数字、小数点、逗号、加号时才做解析，否则直接parseFloat
  if (!/^[\d.,+\s]+$/.test(str)) return parseFloat(str) || 0;
  // 逗号和加号都视为加法
  var parts = str.replace(/,/g, '+').split('+');
  var sum = 0;
  for (var i=0; i<parts.length; i++) {
    var v = parseFloat(parts[i].trim());
    if (!isNaN(v)) sum += v;
  }
  return Math.round(sum * 100) / 100;
}

function getRmbAmt(record) {
  // New format: amount is always RMB
  var raw = 0;
  if (record.amountForeign !== undefined) raw = record.amount || 0;
  else raw = record.amountCNY || record.amount || 0;
  // AA split: divide by people count if > 1, then round to fen
  var result = (record.peopleCount && record.peopleCount > 1) ? raw / record.peopleCount : raw;
  return Math.round(result * 100) / 100;
}

function changeRecCalMonth(delta) {
  rcCalMonth += delta;
  if (rcCalMonth < 0) { rcCalMonth = 11; rcCalYear--; }
  if (rcCalMonth > 11) { rcCalMonth = 0; rcCalYear++; }
  renderRecordsCalendar();
}

function getDayTotals(dateStr) {
  var expense = 0, income = 0, count = 0;
  for (var i=0;i<appData.records.length;i++) {
    var r = appData.records[i];
    if (r.date !== dateStr) continue;
    var amt = getRmbAmt(r);
    if (r.recordType === 'expense') expense += amt; else income += amt;
    count++;
  }
  return { expense: expense, income: income, count: count };
}

function renderRecordsCalendar() {
  var bar = '<div class="rc-header">' +
    '<button onclick="changeRecCalMonth(-1)">&#9664;</button>' +
    '<span class="rc-title">' + rcCalYear + '年' + (rcCalMonth+1) + '月</span>' +
    '<button onclick="changeRecCalMonth(1)">&#9654;</button></div>';
  $('records-cal-bar').innerHTML = bar;
  $('records-cal-grid').innerHTML = buildCalGridHtml(rcCalYear, rcCalMonth);

  // 月度汇总（统计上方日历当前查看的月份）
  var pad2s = function(n){ return n<10?'0'+n:''+n; };
  var ms = rcCalYear + '-' + pad2s(rcCalMonth+1) + '-01';
  var ny = rcCalMonth===11 ? rcCalYear+1 : rcCalYear;
  var nm = rcCalMonth===11 ? 0 : rcCalMonth+1;
  var me = ny + '-' + pad2s(nm+1) + '-01';
  var monthExpense = 0, monthIncome = 0;
  for (var i=0;i<appData.records.length;i++) {
    var r = appData.records[i];
    if (r.date>=ms && r.date<me) {
      if (r.recordType==='expense') monthExpense += getRmbAmt(r);
      else if (r.recordType==='income') monthIncome += getRmbAmt(r);
    }
  }
  $('records-month-summary').innerHTML =
    '<div style="display:flex;">' +
      '<div style="flex:1;text-align:center;">' +
        '<div style="font-size:var(--fs-13);color:var(--text2);margin-bottom:4px;">本月支出</div>' +
        '<div style="font-size:var(--fs-22);font-weight:600;color:var(--danger);">&yen;' + formatMoney(monthExpense) + '</div>' +
      '</div>' +
      '<div style="width:0.5px;background:var(--border);"></div>' +
      '<div style="flex:1;text-align:center;">' +
        '<div style="font-size:var(--fs-13);color:var(--text2);margin-bottom:4px;">本月收入</div>' +
        '<div style="font-size:var(--fs-22);font-weight:600;color:var(--success);">&yen;' + formatMoney(monthIncome) + '</div>' +
      '</div>' +
    '</div>';

  var now = new Date();
  $('records-cal-grid-current').innerHTML = buildCalGridHtml(now.getFullYear(), now.getMonth());
}

function buildCalGridHtml(calYear, calMonth) {
  var dayHeaders = ['一','二','三','四','五','六','日'];
  var now = new Date();
  var pad2 = function(n){ return n<10?'0'+n:''+n; };

  var html = '<div class="rc-grid">';
  for (var dh=0;dh<dayHeaders.length;dh++) { html += '<div class="rc-day-header">' + dayHeaders[dh] + '</div>'; }

  var rawFirstDay = new Date(calYear, calMonth, 1).getDay();
  var firstDay = (rawFirstDay + 6) % 7; // 转换为周一=0...周日=6
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var prevMonthDays = new Date(calYear, calMonth, 0).getDate();

  // leading days from previous month (faded, not clickable)
  for (var li=0; li<firstDay; li++) {
    var pd = prevMonthDays - firstDay + 1 + li;
    html += '<div class="rc-cell rc-other"><span class="rc-date-num">' + pd + '</span></div>';
  }

  for (var d=1; d<=daysInMonth; d++) {
    var dateStr = calYear + '-' + pad2(calMonth+1) + '-' + pad2(d);
    var isToday = (calYear===now.getFullYear() && calMonth===now.getMonth() && d===now.getDate());
    var totals = getDayTotals(dateStr);
    var cellClass = 'rc-cell';
    var inner = '';
    if (totals.count === 0) {
      inner = '<span class="rc-date-num">' + d + '</span>';
    } else {
      cellClass += ' rc-has-data';
      if (totals.expense > 0) cellClass += ' rc-has-expense';
      if (totals.income > 0) cellClass += ' rc-has-income';
      inner = '<span class="rc-date-num">' + d + '</span><span class="rc-amt-wrap">';
      if (totals.expense > 0) inner += '<span class="rc-amt-expense">' + Math.round(totals.expense) + '</span>';
      if (totals.income > 0) inner += '<span class="rc-amt-income">' + Math.round(totals.income) + '</span>';
      inner += '</span>';
    }
    html += '<div class="' + cellClass + (isToday?' rc-today':'') + '" onclick="onRecCalDayClick(\'' + dateStr + '\')">' + inner + '</div>';
  }

  // trailing days from next month (faded, not clickable)
  var totalCells = firstDay + daysInMonth;
  var trailing = (7 - (totalCells % 7)) % 7;
  for (var ti=1; ti<=trailing; ti++) {
    html += '<div class="rc-cell rc-other"><span class="rc-date-num">' + ti + '</span></div>';
  }

  html += '</div>';
  return html;
}

function onRecCalDayClick(dateStr) {
  var totals = getDayTotals(dateStr);
  if (totals.count === 0) {
    appConfirm(dateStr + ' 暂无记录，是否记一笔？', function() {
      showRecordModal();
      setTimeout(function(){ if ($('recDate')) $('recDate').value = dateStr; }, 0);
    }, {title:dateStr, okText:'记一笔'});
    return;
  }
  showDayDetailModal(dateStr);
}

function showDayDetailModal(dateStr) {
  var records = [];
  for (var i=0;i<appData.records.length;i++) { if (appData.records[i].date === dateStr) records.push(appData.records[i]); }
  records.sort(function(a,b){ return (a.id||'').localeCompare(b.id||''); });

  var rowsHtml = '';
  for (var gi=0; gi<records.length; gi++) {
    var gr = records[gi];
    var trip = gr.tripId ? getTripById(gr.tripId) : null;
    var cp = gr.catPath||[];
    var catPath = cp.length>0 ? cp[cp.length-1] : '';
    var isIncome = gr.recordType === 'income';
    var rmb = getRmbAmt(gr);
    var foreignInfo = '';
    var originalInfo = '';
    if (gr.originalAmount > 0) {
      originalInfo = '<div class="txt-hint">原币金额: ' + escHtml(gr.originalCurrency||'') + ' ' + formatMoney(gr.originalAmount) + '</div>';
    }
    if (gr.amountForeign > 0 && gr.currency) {
      foreignInfo = '<div class="txt-hint">实付: ' + escHtml(gr.currency) + ' ' + formatMoney(gr.amountForeign) + ' × ' + (gr.exchangeRate||'?') + '</div>';
    } else if (!gr.amountForeign && gr.currency && gr.currency !== 'CNY' && gr.amountCNY !== undefined) {
      foreignInfo = '<div class="txt-hint">实付: ' + escHtml(gr.currency) + ' ' + formatMoney(gr.amount||0) + '</div>';
    }
    var splitInfo = '';
    if (gr.payee && gr.peopleCount > 1) {
      splitInfo = '<span class="payee-badge">' + escHtml(gr.payee) + ' ÷' + gr.peopleCount + '人</span>';
    } else if (gr.payee) {
      splitInfo = '<span class="payee-badge">' + escHtml(gr.payee) + '</span>';
    }
    rowsHtml += '<div class="rc-day-modal-row" onclick="closeAllModals();showRecordAction(\'' + gr.id + '\')">' +
      '<div style="flex:1;">' +
        '<div style="font-size:var(--fs-14);">' + escHtml(catPath) + (trip?'<span class="badge-travel">旅游:'+escHtml(trip.name)+'</span>':'') + (gr.paymentMethod?'<span class="pay-badge">'+escHtml(gr.paymentMethod)+'</span>':'') + (gr.specialTag?'<span class="pay-badge" style="background:#FDEEDD;color:#B5772E;">专项:'+escHtml(gr.specialTag)+'</span>':'') + splitInfo + '</div>' +
        (gr.note?'<div style="font-size:var(--fs-11);color:var(--text2);margin-top:2px;">'+escHtml(gr.note)+'</div>':'') +
        originalInfo + foreignInfo +
      '</div>' +
      '<div style="font-weight:600;white-space:nowrap;margin-left:10px;color:' + (isIncome?'var(--success)':'var(--danger)') + ';">' + (isIncome?'+':'-') + '&yen;' + formatMoney(rmb) + '</div>' +
    '</div>';
  }

  openModalShell({id:'dayDetailOverlay', title:dateStr, style:'max-height:75vh;overflow-y:auto;', body:rowsHtml,
    footer:'<button class="btn btn-outline" style="flex:1;" onclick="closeModal(this)">关闭</button>' +
    '<button class="btn btn-primary" style="flex:1;" onclick="closeAllModals();showRecordModal();setTimeout(function(){if($(\'recDate\'))$(\'recDate\').value=\'' + dateStr + '\';},0);">+ 记一笔</button>'});
}

}
function onAmountBlur() {
  // 失焦时如果是表达式则计算并显示结果预览（但保留原始字符串）
  var el = $('recAmount');
  if (!el) return;
  var val = el.value.trim();
  if (val.indexOf(',') !== -1 || val.indexOf('+') !== -1) {
    var sum = parseAmountExpr(val);
    // 在split hint位置显示合计提示
    var hint = document.getElementById('recAmountHint');
    if (hint) { hint.textContent = '= ' + formatMoney(sum); hint.style.display = ''; }
  } else {
    var hint2 = document.getElementById('recAmountHint');
    if (hint2) hint2.style.display = 'none';
  }
  onPayeeChange();
}

function autoCalcRmb() {
  var foreign = parseFloat($('recForeignAmt').value) || 0;
  var rate = parseFloat($('recExRate').value) || 0;
  if (foreign > 0 && rate > 0) {
    $('recAmount').value = (foreign * rate).toFixed(2);
    var hint = document.getElementById('recAmountHint');
    if (hint) hint.style.display = 'none';
    onPayeeChange();
  }
}

function onPayeeChange() {
  var payeeVal = ($('recPayee').value||'').trim();
  var wrap = document.getElementById('recPeopleWrap');
  if (wrap) {
    wrap.style.display = payeeVal ? '' : 'none';
    if (!payeeVal && $('recPeople')) $('recPeople').value = '2';
  }
  var hint = document.getElementById('recSplitHint');
  if (hint) {
    var amt = parseAmountExpr($('recAmount').value||'');
    var count = payeeVal ? (parseInt($('recPeople').value) || 1) : 1;
    if (payeeVal && count > 1 && amt > 0) {
      hint.textContent = '人均 ¥' + formatMoney(amt / count);
      hint.style.display = '';
    } else {
      hint.style.display = 'none';
    }
  }
}

function fetchRealtimeRate() {
  var currency = ($('recPayCurrency').value||'').trim().toUpperCase();
  if (!currency) return;
  if (currency === 'CNY') { $('recExRate').value = '1'; autoCalcRmb(); return; }
  var rate = appData.rates[currency];
  if (rate && rate > 0) {
    $('recExRate').value = (1 / rate).toFixed(6);
    autoCalcRmb();
  } else {
    toast('未找到 ' + currency + ' 的汇率，请在汇率管理中补充', true);
  }
}

function showRecordModal(editId, tpl) {
  var editRecord = null;
  if (editId) {
    for (var i=0;i<appData.records.length;i++) { if (appData.records[i].id===editId) { editRecord=appData.records[i]; break; } }
  }
  recRecordType = editRecord ? (editRecord.recordType || 'expense') : 'expense';
  var defTripId = editRecord ? (editRecord.tripId||'daily') : (tpl ? (tpl.tripId||'daily') : 'daily');
  var tripOpts = '';
  for (var ti=0;ti<appData.trips.length;ti++) { tripOpts += '<option value="'+appData.trips[ti].id+'"'+(defTripId===appData.trips[ti].id?' selected':'')+'>旅游: '+escHtml(appData.trips[ti].name)+'</option>'; }
  var defRmbAmt = '';
  var defOriginalAmount = '';
  var defOriginalCurrency = '';
  var defForeignAmt = '';
  var defPayCurrency = '';
  var defExRate = '';
  if (editRecord) {
    var oldCur = editRecord.currency || '';
    defOriginalAmount = editRecord.originalAmount || '';
    defOriginalCurrency = editRecord.originalCurrency || '';
    if (editRecord.amountForeign || (oldCur && oldCur !== 'CNY')) {
      // 外币记录
      defRmbAmt = editRecord.amountForeign ? editRecord.amount : (editRecord.amountCNY || editRecord.amount || '');
      defForeignAmt = editRecord.amountForeign || editRecord.amount || '';
      defPayCurrency = editRecord.currency || '';
      var num = parseFloat(defRmbAmt);
      var den = parseFloat(defForeignAmt);
      defExRate = editRecord.exchangeRate || (num && den ? (num / den).toFixed(6) : '');
    } else {
      // CNY 记录：amount 即 RMB，优先回显原始表达式
      defRmbAmt = editRecord.amountExpr || editRecord.amount || editRecord.amountCNY || '';
    }
  }
  var defDate = editRecord ? editRecord.date : todayStr();
  var defNote = editRecord ? (editRecord.note||'') : (tpl ? (tpl.note||'') : '');

function onRecBelongChange() {
  var belong = $('recBelong').value;
  var payeeRow = document.getElementById('recPayeeRow');
  if (belong === 'daily') {
    if (payeeRow) payeeRow.style.display = 'none';
  } else {
    if (payeeRow) payeeRow.style.display = 'block';
    onPayeeChange();
  }
  var cats = belong === 'daily' ? appData.dailyCats : appData.travelCats;
  var leafOptions = [];
  function collect(cat, path) {
    var p = path.concat(cat.name);
    if (cat.subs && cat.subs.length>0) {
      for (var j=0;j<cat.subs.length;j++) { collect(cat.subs[j], p); }
    } else {
      // 叶子节点
      var display = cat.name;
      // 如果叶子节点名称在全局重复，加父级标注
      var dupCount = 0;
      for (var k=0;k<leafOptions.length;k++) { if (leafOptions[k].name===cat.name) dupCount++; }
      if (dupCount>0) display = (p.length>1 ? p[p.length-2]+' > ' : '') + cat.name;
      leafOptions.push({
        name: cat.name,
        display: display,
        path: p,
        value: p.join('||')
      });
    }
  }
  for (var i=0;i<cats.length;i++) { collect(cats[i], []); }
  var opts = '';
  for (var i=0;i<leafOptions.length;i++) { opts += '<option value="'+leafOptions[i].value+'">'+leafOptions[i].display+'</option>'; }
  $('recCat').innerHTML = opts;
  $('recTypeRow').style.display = belong === 'daily' ? 'flex' : 'none';
  if (belong !== 'daily') recRecordType = 'expense';
  var overlay = document.getElementById('recordModalOverlay');
  if (overlay && overlay._editCatPath && overlay._editCatPath.length>0) {
    $('recCat').value = overlay._editCatPath.join('||');
    overlay._editCatPath = null;
  }
  onRecCatChange();
}
function onRecCatChange() {
  var val = $('recCat').value;
  var parts = val ? val.split('||') : [];
  $('recCatL2').textContent = parts.length>1 ? parts[1] : '';
  $('recCatL1').textContent = parts.length>0 ? parts[0] : '';
}

function saveRecord() {

  var hasExpr = amountRaw.indexOf(',') !== -1 || amountRaw.indexOf('+') !== -1;
  var originalAmount = parseFloat($('recOriginalAmount').value) || 0;
  var originalCurrency = ($('recOriginalCurrency').value||'').trim().toUpperCase();
  var foreignAmt = parseFloat($('recForeignAmt').value) || 0;
  var payCurrency = ($('recPayCurrency').value||'').trim().toUpperCase();
  var exRate = parseFloat($('recExRate').value) || 0;
  var catPath = $('recCat').value ? $('recCat').value.split('||') : [];
  var payeeVal = ($('recPayee').value||'').trim();
  var record = {
    id: genId(),
    type: belong === 'daily' ? 'daily' : 'travel',
    catPath: catPath,
    amount: rmbAmount,
    amountExpr: hasExpr ? amountRaw : undefined,
    originalAmount: originalAmount || 0,

    amountForeign: foreignAmt || 0,
    currency: payCurrency,
    exchangeRate: exRate || 0,
    date: $('recDate').value,

    catDatalist +
    '<div class="form-row"><label>备注关键词</label><input type="text" id="asNote" placeholder="如：牛肉" autocomplete="off"></div>'});

function runAdvancedSearch() {
  var yearVal = ($('asYear').value||'').trim();
  var catVal = ($('asCat').value||'').trim();
  var noteVal = ($('asNote').value||'').trim().toLowerCase();

  var catPrefix = null;
  if (catVal) {
    catPrefix = findCatPrefixByName(catVal);
    if (!catPrefix) {
      $('asResultArea').innerHTML = '<div class="as-empty">未找到名为"'+escHtml(catVal)+'"的分类，请检查输入或从建议列表中选择</div>';
      return;
    }
  }

  var ms = yearVal ? yearVal+'-01-01' : null;
  var me = yearVal ? (parseInt(yearVal,10)+1)+'-01-01' : null;

  var results = [];
  for (var i=0;i<appData.records.length;i++) {
    var r = appData.records[i];
    if (ms && (r.date < ms || r.date >= me)) continue;
    if (catPrefix && !catMatchesPath(r.catPath, catPrefix)) continue;
    if (noteVal && (!r.note || r.note.toLowerCase().indexOf(noteVal) === -1)) continue;
    results.push(r);
  }
  results.sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });

  var expenseSum = 0, incomeSum = 0;
  for (var ri=0; ri<results.length; ri++) {
    if (results[ri].recordType==='expense') expenseSum += getRmbAmt(results[ri]);
    else if (results[ri].recordType==='income') incomeSum += getRmbAmt(results[ri]);
  }

  var html = '<div class="as-summary"><span><span class="as-label">共</span> '+results.length+' <span class="as-label">笔</span></span>' +
    '<span><span class="as-label">支出</span> <span style="color:var(--danger);font-weight:600;">&yen;'+formatMoney(expenseSum)+'</span></span>' +
    '<span><span class="as-label">收入</span> <span style="color:var(--success);font-weight:600;">&yen;'+formatMoney(incomeSum)+'</span></span></div>';

  if (results.length === 0) {
    html += '<div class="as-empty">没有符合条件的记录</div>';
  } else {
    for (var hi=0; hi<results.length; hi++) {
      var rec = results[hi];
      var cp = rec.catPath||[];
      var catName = cp.length>0 ? cp[cp.length-1] : '';
      var amt = getRmbAmt(rec);
      var amtColor = rec.recordType==='income' ? 'var(--success)' : 'var(--danger)';
      html += '<div class="as-result-row" onclick="closeAllModals();showRecordAction(\''+rec.id+'\')"><div>' +
        '<div style="font-size:var(--fs-13);">'+escHtml(catName)+'</div>' +
        '<div class="txt-hint">'+(rec.date||'')+(rec.note?' · '+escHtml(rec.note):'')+'</div></div>' +
        '<div style="font-weight:600;color:'+amtColor+';">&yen;'+formatMoney(amt)+'</div></div>';
    }
  }
  $('asResultArea').innerHTML = html;
}

function saveAssetItem(groupKey, itemId) {
  var name = ($('assetItemName').value||'').trim();
  if (!name) { toast('请输入名称', true); return; }
  var amount = parseFloat($('assetItemAmount').value) || 0;
  var list = appData.assets[groupKey];
  var item = null;
  if (itemId) { for (var i=0;i<list.length;i++) { if (list[i].id===itemId) { item=list[i]; break; } } }
  if (!item) {
    item = { id: genId() };
    list.push(item);
  }
  item.name = name;
  if (groupKey === 'bankCards') item.balance = amount;
  else item.amount = amount;

  closeAllModals();

}

function deleteAssetItem(groupKey, itemId) {

    appData.assets[groupKey] = appData.assets[groupKey].filter(function(x){ return x.id!==itemId; });

function switchCatManageTab(tab) {

function renderCatManage() {

function renderCatL1(cat, idx, type) {
  var path = cat.name;
  var expanded = catExpandState[path];
  var subCount = (cat.subs||[]).length;
  var html = '<div class="cat-row cat-row-l1" draggable="true" '+
    'ondragstart="onDragStart(event,\''+type+'\',-1,'+idx+',1)" '+
    'ondragend="onDragEnd(event)" '+
    'ondragover="onDragOver(event,\''+type+'\',-1,'+idx+',1)" '+
    'ondragleave="onDragLeave(event)" '+
    'ondrop="onDrop(event,\''+type+'\',-1,'+idx+',1)" '+
    'onclick="toggleCatExpand(\''+path+'\')">' +
    '<span>'+escHtml(cat.name)+'</span>' +

    '<span class="cat-more" onclick="event.stopPropagation();showCatActionMenu(\''+type+'\',\''+path+'\',1,\''+idx+'\')">···</span>' +
    '</div>';

    for (var j=0;j<cat.subs.length;j++) {
      var sub = cat.subs[j];

      var subCount2 = (sub.subs||[]).length;
      html += '<div class="cat-row cat-row-l2" draggable="true" '+
        'ondragstart="onDragStart(event,\''+type+'\','+idx+','+j+',2)" '+
        'ondragend="onDragEnd(event)" '+
        'ondragover="onDragOver(event,\''+type+'\','+idx+','+j+',2)" '+
        'ondragleave="onDragLeave(event)" '+
        'ondrop="onDrop(event,\''+type+'\','+idx+','+j+',2)" '+

        '<span>'+escHtml(sub.name)+'</span>' +
        (subCount2 ? '<span class="cat-count">'+subCount2+'个3级</span>' : '') +
        '<span class="cat-more" onclick="event.stopPropagation();showCatActionMenu(\''+type+'\',\''+subPath+'\',2,\''+idx+','+j+'\')">···</span>' +
        '</div>';

        html += '<div class="cat-chips">';
        for (var k=0;k<sub.subs.length;k++) {
          var sub3 = sub.subs[k];
          var sub3Path = subPath+'.'+sub3.name;
          html += '<span class="cat-chip" onclick="event.stopPropagation();showCatActionMenu(\''+type+'\',\''+sub3Path+'\',3,\''+idx+','+j+','+k+'\')">'+escHtml(sub3.name)+'</span>';
        }

      }

  return html;
