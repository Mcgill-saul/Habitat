function toggleCatExpand(path) {
  catExpandState[path] = !catExpandState[path];
  renderCatManage();
}

var dragInfo = null;

function onDragStart(e, type, pidx, idx, level) {
  dragInfo = { type: type, pidx: pidx, idx: idx, level: level };
  e.target.classList.add('dragging');
}

function onDragEnd(e) {
  e.target.classList.remove('dragging');
  var overs = document.querySelectorAll('.drag-over');
  for (var i=0;i<overs.length;i++) overs[i].classList.remove('drag-over');
  dragInfo = null;
}

function onDragOver(e, type, pidx, idx, level) {
  e.preventDefault();
  if (!dragInfo || dragInfo.type !== type || dragInfo.level !== level) return;
  if (dragInfo.pidx !== pidx) return;
  if (dragInfo.idx === idx) return;
  e.target.classList.add('drag-over');
}

function onDragLeave(e) {
  e.target.classList.remove('drag-over');
}

function onDrop(e, type, pidx, idx, level) {
  e.preventDefault();
  e.target.classList.remove('drag-over');
  if (!dragInfo || dragInfo.type !== type || dragInfo.level !== level) return;
  if (dragInfo.pidx !== pidx) return;
  var cats = type === 'daily' ? appData.dailyCats : appData.travelCats;
  var arr = level === 1 ? cats : cats[dragInfo.pidx].subs;
  var moved = arr.splice(dragInfo.idx, 1)[0];
  arr.splice(dragInfo.idx < idx ? idx - 1 : idx, 0, moved);
  saveData();
  catExpandState = {};
  renderCatManage();
}

function showCatActionMenu(type, path, level, idxStr) {
  var items = [{label:'编辑名称', fn:"editCatAction('"+type+"','"+path+"',"+level+",'"+idxStr+"')"}];
  if (level < 3) items.push({label:'添加子类别', fn:"addSubCatAction('"+type+"','"+path+"',"+level+")"});
  items.push({label:'删除', fn:"deleteCatAction('"+type+"','"+path+"',"+level+")", danger:true});
  openActionSheet(path.split('.').pop(), items);
}

function editCatAction(type, path, level, idxStr) {
  appInput('编辑名称', function(name) {
    editCatNameInner(type, path, name);
    saveData(); toast('已更新'); renderCatManage();
  }, {value:path.split('.').pop(), placeholder:'类别名称'});
}

function addSubCatAction(type, path, level) {
  appInput('添加子类别', function(name) {
    if (addSubCatInner(type, path, name) === false) { toast('类别已存在', true); return false; }
    saveData(); toast('已新增');
    catExpandState[path] = true;
    renderCatManage();
  }, {placeholder:'子类别名称'});
}

function deleteCatAction(type, path, level) {
  // Check if any records use this category path
  var parts = path.split('.');
  var hasRecords = false;
  for (var ri=0; ri<appData.records.length; ri++) {
    var r = appData.records[ri];
    if (!r.catPath || r.catPath.length < parts.length) continue;
    var match = true;
    for (var pi=0; pi<parts.length; pi++) { if (r.catPath[pi]!==parts[pi]) { match=false; break; } }
    if (match) { hasRecords=true; break; }
  }
  var catName = parts[parts.length-1];
  function removeCat(keepRecords) {
    if (hasRecords) {
      if (keepRecords) {
        // 保留记录：只清掉这些记录的类别标记（catPath 置空）
        for (var ri2=0; ri2<appData.records.length; ri2++) {
          var r2 = appData.records[ri2];
          if (!r2.catPath || r2.catPath.length < parts.length) continue;
          var m = true;
          for (var pi2=0; pi2<parts.length; pi2++) { if (r2.catPath[pi2]!==parts[pi2]) { m=false; break; } }
          if (m) r2.catPath = [];
        }
      } else {
        // 删除记录：连同用到这个类别路径的记录一起删
        appData.records = appData.records.filter(function(r){
          if (!r.catPath || r.catPath.length < parts.length) return true;
          for (var pi=0; pi<parts.length; pi++) { if (r.catPath[pi]!==parts[pi]) return true; }
          return false;
        });
      }
    }
    deleteCatInner(type, path);
    saveData(); toast('已删除');
    renderCatManage();
    if (hasRecords) renderRecords();
  }
  if (hasRecords) {
    appChoose('类别「'+catName+'」下已有记账记录。\n保留记录：记录保留，只去掉类别标记；\n删除记录：连同记录一起删除。', [
      {label:'保留记录', primary:true, fn:function(){ removeCat(true); }},
      {label:'删除记录', danger:true, fn:function(){ removeCat(false); }},
      {label:'取消'}
    ], '删除类别「'+catName+'」');
  } else {
    appConfirm('删除「'+catName+'」及其所有子类别？', function(){ removeCat(false); });
  }
}

function addRootCat() {
  appInput('新增1级类别', function(name) {
    var cats = catManageTab==='daily' ? appData.dailyCats : appData.travelCats;
    for (var i=0;i<cats.length;i++) { if (cats[i].name===name) { toast('类别已存在', true); return false; } }
    cats.push({ name:name, subs:[] });
    saveData(); toast('已新增'); renderCatManage();
  }, {placeholder:'类别名称'});
}

function addSubCatInner(type, path, name) {
  var cats = type==='daily' ? appData.dailyCats : appData.travelCats;
  var parts = path.split('.');
  var current = cats;
  for (var i=0;i<parts.length;i++) {
    var found = null;
    for (var j=0;j<current.length;j++) { if (current[j].name===parts[i]) { found=current[j]; break; } }
    if (!found) return;
    current = found.subs || [];
  }
  for (var k=0;k<current.length;k++) { if (current[k].name===name) return false; }
  current.push({ name:name, subs:[] });
}

function editCatNameInner(type, path, newName) {
  var cats = type==='daily' ? appData.dailyCats : appData.travelCats;
  var parts = path.split('.');
  // Update category tree
  if (parts.length===1) {
    for (var i=0;i<cats.length;i++) { if (cats[i].name===parts[0]) { cats[i].name=newName; break; } }
  } else {
    var current = cats;
    for (var j=0;j<parts.length-1;j++) {
      var found = null;
      for (var k=0;k<current.length;k++) { if (current[k].name===parts[j]) { found=current[k]; break; } }
      if (!found) return;
      current = found.subs || [];
    }
    for (var m=0;m<current.length;m++) { if (current[m].name===parts[parts.length-1]) { current[m].name=newName; break; } }
  }
  // Update existing records that use this category path
  var recType = type==='daily' ? 'daily' : null;
  for (var ri=0; ri<appData.records.length; ri++) {
    var r = appData.records[ri];
    if (recType && r.type!=='daily') continue;
    if (!r.catPath) continue;
    for (var pi=0; pi<r.catPath.length; pi++) {
      if (pi<parts.length && r.catPath[pi]===parts[pi]) {
        if (pi===parts.length-1 && r.catPath.length>=parts.length) {
          r.catPath[parts.length-1] = newName;
        }
      } else { break; }
    }
  }
}

function deleteCatInner(type, path) {
  var cats = type==='daily' ? appData.dailyCats : appData.travelCats;
  var parts = path.split('.');
  if (parts.length===1) {
    for (var i=0;i<cats.length;i++) { if (cats[i].name===parts[0]) { cats.splice(i,1); break; } }
  } else {
    var current = cats;
    for (var j=0;j<parts.length-1;j++) {
      var found = null;
      for (var k=0;k<current.length;k++) { if (current[k].name===parts[j]) { found=current[k]; break; } }
      if (!found) return;
      current = found.subs || [];
    }
    for (var m=0;m<current.length;m++) { if (current[m].name===parts[parts.length-1]) { current.splice(m,1); break; } }
  }
}


// ============ COST TAB ============
// 依赖: appData.costItems/costCats(DATA), saveData(DATA), openModal/closeAllModals(MODAL)
// costCats结构: [{name:'碳水', subs:['燕麦','米饭']}, ...]
// costItems结构: {id, cat(大类名), subCat(小类名), breed, name, price, amount, dailyIntake}

var costGroupCollapsed = {};
var costSubCollapsed  = {};
// 默认颜色表（hex）
var COST_CAT_DEFAULT_COLORS = ['#4A90D9','#27AE60','#E67E22','#9B59B6','#E74C3C','#1ABC9C'];
// 小类透明度梯度
var SUB_ALPHAS = [0.10, 0.07, 0.05, 0.04, 0.03];

// 从 hex 推导颜色体系
function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  return r + ',' + g + ',' + b;
}
// 根据rgb算深色文字
function rgbToTextColor(rgb) {
  var parts = rgb.split(',').map(Number);
  var lum = 0.299*parts[0] + 0.587*parts[1] + 0.114*parts[2];
  // 返回深色版（饱和度保留，亮度降低）
  return 'rgba(' + parts.map(function(v){ return Math.round(v*0.45); }).join(',') + ',1)';
}
function getCatColors(cat, ci) {
  var hex = (cat && cat.color) ? cat.color : COST_CAT_DEFAULT_COLORS[ci % COST_CAT_DEFAULT_COLORS.length];
  var rgb = hexToRgb(hex);
  return {
    bg:    'rgba(' + rgb + ',0.12)',
    text:  rgbToTextColor(rgb),
    rgb:   rgb
  };
}

function renderTodos() {
  var cats  = appData.costCats  || [];
  var items = appData.costItems || [];
  // 新大类默认收起
  for (var _i = 0; _i < cats.length; _i++) {
    if (costGroupCollapsed[cats[_i].name] === undefined) costGroupCollapsed[cats[_i].name] = true;
  }

  var html = '<div class="cost-toolbar">' +
    '<div class="cost-toolbar-title">成本比较</div>' +
    '<button class="btn-link" style="font-size:var(--fs-13);" onclick="manageCostCats()">管理分类</button>' +
    '</div>';

  if (!cats.length) {
    html += '<div style="text-align:center;color:var(--text2);padding:40px 0;font-size:var(--fs-14);">请先添加分类</div>';
    document.getElementById('cost-container').innerHTML = html;
    return;
  }

  for (var ci = 0; ci < cats.length; ci++) {
    var bigCat     = cats[ci];
    var bigName    = bigCat.name;
    var subs       = bigCat.subs || [];
    var bigItems   = items.filter(function(it){ return it.cat === bigName; });
    var isBigCollapsed = !!costGroupCollapsed[bigName];

    html += '<div class="cost-group">';
    // ── 大类 header ──
    var catColors = getCatColors(bigCat, ci);
    html += '<div class="cost-group-header' + (isBigCollapsed ? ' collapsed' : '') + '" style="background:' + catColors.bg + ';color:' + catColors.text + ';" onclick="toggleCostGroup(\'' + escHtml(bigName) + '\')">' +
      '<span>' + escHtml(bigName) +
        '<span style="font-size:var(--fs-12);font-weight:400;margin-left:6px;opacity:0.7;">' + bigItems.length + '款</span>' +
      '</span>' +
    '</div>';

    if (!isBigCollapsed) {
      html += '<div class="cost-group-body">';

      // 先渲染有小类的
      for (var si = 0; si < subs.length; si++) {
        var subName   = subs[si];
        var subKey    = bigName + '/' + subName;
        var subItems  = bigItems.filter(function(it){ return it.subCat === subName; });
        subItems.sort(function(a,b){ return calcDailyCost(a) - calcDailyCost(b); });
        var isSubCollapsed = !!costSubCollapsed[subKey];

        html += '<div class="cost-subgroup">';
        var subAlpha = SUB_ALPHAS[si % SUB_ALPHAS.length];
        var subBg = 'rgba(' + catColors.rgb + ',' + subAlpha + ')';
        var subColor = catColors.text;
        html += '<div class="cost-subgroup-header" style="background:' + subBg + ';" onclick="toggleCostSub(\'' + escHtml(bigName) + '\',\'' + escHtml(subName) + '\')">' +
          '<span class="cost-subgroup-label" style="color:' + subColor + ';">' + escHtml(subName) + '</span>' +
          '<span class="cost-subgroup-count" style="color:' + subColor + ';opacity:0.6;">' + subItems.length + '款</span>' +
        '</div>';

        if (!isSubCollapsed) {
          for (var ii = 0; ii < subItems.length; ii++) {
            html += renderCostItemRow(subItems[ii], ii === 0 && subItems.length > 1, catColors, subBg);
          }
        }
        html += '</div>';
      }

      // 再渲染未分小类的（subCat为空或不在subs里）
      var uncategorized = bigItems.filter(function(it){
        return !it.subCat || subs.indexOf(it.subCat) < 0;
      });
      uncategorized.sort(function(a,b){ return calcDailyCost(a) - calcDailyCost(b); });
      if (uncategorized.length) {
        html += '<div class="cost-subgroup">';
        html += '<div class="cost-subgroup-header">' +
          '<span class="cost-subgroup-label" style="color:var(--text2);">未分类</span>' +
          '<span class="cost-subgroup-count">' + uncategorized.length + '款</span>' +
        '</div>';
        for (var ui = 0; ui < uncategorized.length; ui++) {
          html += renderCostItemRow(uncategorized[ui], false, catColors, null);
        }
        html += '</div>';
      }

      html += '</div>'; // cost-group-body
    }
    html += '</div>'; // cost-group
  }

  document.getElementById('cost-container').innerHTML = html;
}

function renderCostItemRow(it, isBest, colors, subBg) {
  var daily  = calcDailyCostStr(it);
  var days   = calcDaysStr(it);
  var per500 = calcPer500(it);
  var itemBg = subBg || (colors ? colors.bg : 'var(--bg)');
  var breedBg = colors ? colors.bg : 'rgba(0,0,0,0.06)';
  var breedColor = colors ? colors.text : 'var(--text2)';
  var bestBadge = isBest ? '<span class="cost-best-badge">最优</span>' : '';
  var nameContent = it.breed
    ? '<span style="flex-shrink:0;font-size:var(--fs-11);font-weight:600;background:' + breedBg + ';color:' + breedColor + ';border-radius:var(--r-xs);padding:1px 6px;">' + escHtml(it.breed) + '</span>' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-size:var(--fs-11);">' + escHtml(it.name) + '</span>' + bestBadge
    : '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(it.name) + '</span>' + bestBadge;
  return '<div class="cost-item" style="background:' + itemBg + ';"' +
    ' onpointerdown="startLongPressCost(\'' + it.id + '\',event)" onpointerup="cancelLongPress()" onpointerleave="cancelLongPress()" onclick="showCostItemModal(\'' + it.id + '\',null,null)">' +
    '<div class="cost-item-info">' +
      '<div class="cost-item-name">' + nameContent + '</div>' +
      '<div class="cost-item-sub">' + buildCostItemSub(it, per500) + '</div>' +
    '</div>' +
    '<div class="cost-item-stats">' +
      '<div class="cost-item-daily">\xA5' + daily + '/天</div>' +
      '<div class="cost-item-days">消耗' + days + '天</div>' +
    '</div>' +
  '</div>';
}

function buildCostItemSub(it, per500) {
  if (it.mode === 'period') {
    return '¥' + it.price + ' / ' + it.period + '天期';
  }
  var unit = it.unit || 'g';
  return '¥' + it.price + ' / ' + it.amount + unit +
    (per500 !== '—' ? ' · ¥' + per500 + '/500' + unit : '') +
    (it.dailyIntake ? ' · 日用' + it.dailyIntake + unit : '');
}
function calcPer500(it) {
  if (!it.amount || it.amount <= 0) return '—';
  if ((it.unit || 'g') !== 'g') return '—';
  return (it.price / it.amount * 500).toFixed(2);
}
function calcDaysStr(it) {
  if (it.mode === 'period') return it.period ? String(it.period) : '—';
  if (!it.dailyIntake || it.dailyIntake <= 0) return '—';
  return (it.amount / it.dailyIntake).toFixed(1);
}
function calcDailyCost(it) {
  if (it.mode === 'period') {
    if (!it.period || it.period <= 0 || !it.price || it.price <= 0) return Infinity;
    return it.price / it.period;
  }
  if (!it.dailyIntake || it.dailyIntake <= 0 || !it.amount || it.amount <= 0) return Infinity;
  return it.price / (it.amount / it.dailyIntake);
}
function calcDailyCostStr(it) {
  var v = calcDailyCost(it);
  return v === Infinity ? '—' : v.toFixed(2);
}

function toggleCostGroup(bigName) {
  costGroupCollapsed[bigName] = !costGroupCollapsed[bigName];

}
function toggleCostSub(bigName, subName) {
  var key = bigName + '/' + subName;

}

      '<div class="form-row"><label>品种</label><input type="text" id="ciBreed" class="input-box" placeholder="如：燕麢片" value="' + (item && item.breed ? escHtml(item.breed) : '') + '"></div>' +

function saveCostItem(id) {
  var bigCat = document.getElementById('ciBigCat').value;
  var subCat = document.getElementById('ciSubCat').value;
  var breed  = document.getElementById('ciBreed').value.trim();
  var name   = document.getElementById('ciName').value.trim();
  var price  = parseFloat(document.getElementById('ciPrice').value);
  var modeEl = document.querySelector('input[name="ciMode"]:checked');
  var mode   = modeEl ? modeEl.value : 'qty';
  if (!breed && !name) return toast('品种和款式至少输入一个', true);
  if (!price || price <= 0) return toast('请输入有效价格', true);
  var record;
  if (mode === 'period') {
    var period = parseFloat(document.getElementById('ciPeriod').value);
    if (!period || period <= 0) return toast('请输入有效周期天数', true);
    record = { id: id || genId(), cat: bigCat, subCat: subCat, breed: breed, name: name, price: price, mode: 'period', period: period };
  } else {
    var amount = parseFloat(document.getElementById('ciAmount').value);
    var daily  = parseFloat(document.getElementById('ciDaily').value);
    var unit   = document.getElementById('ciUnit').value.trim() || 'g';
    if (!amount || amount <= 0) return toast('请输入有效购买量', true);
    if (!daily  || daily  <= 0) return toast('请输入有效日用量', true);
    record = { id: id || genId(), cat: bigCat, subCat: subCat, breed: breed, name: name, price: price, mode: 'qty', amount: amount, dailyIntake: daily, unit: unit };
  }
  if (id) {
    for (var i = 0; i < appData.costItems.length; i++) {
      if (appData.costItems[i].id === id) { appData.costItems[i] = record; break; }
    }
  } else {
    appData.costItems.push(record);
  }
  saveData(); toast(id ? '已更新' : '已新增'); closeAllModals(); renderTodos();
}

var costDragInfo = null;

function onCostDragStart(e, idx, pidx, level) {
  costDragInfo = { idx: idx, pidx: pidx, level: level };
  e.target.classList.add('dragging');
}

function onCostDragOver(e, idx, pidx, level) {
  e.preventDefault();
  if (!costDragInfo || costDragInfo.level !== level) return;
  if (costDragInfo.pidx !== pidx) return;
  if (costDragInfo.idx === idx) return;
  e.target.classList.add('drag-over');
}

function onCostDrop(e, idx, pidx, level) {
  e.preventDefault();
  e.target.classList.remove('drag-over');
  if (!costDragInfo || costDragInfo.level !== level) return;
  if (costDragInfo.pidx !== pidx) return;
  var arr = level === 1 ? appData.costCats : appData.costCats[costDragInfo.pidx].subs;
  var moved = arr.splice(costDragInfo.idx, 1)[0];
  arr.splice(costDragInfo.idx < idx ? idx - 1 : idx, 0, moved);
  costDragInfo = null;
  saveData();
  costCatExpandState = {};
  renderCostCatManageList();
  renderTodos();
}

function toggleCostCatExpand(bigName) {
  costCatExpandState[bigName] = !costCatExpandState[bigName];
  renderCostCatManageList();
}

function deleteCostSubCat(bi, si) {

  var count   = appData.costItems.filter(function(it){ return it.cat === bigName && it.subCat === sub; }).length;
  var msg     = count > 0 ? '删除小类「' + sub + '」？该小类下的 ' + count + ' 条记录将移到「未分类」。' : '删除小类「' + sub + '」？';
  appConfirm(msg, function() {

    for (var j = 0; j < appData.costItems.length; j++) {
      if (appData.costItems[j].cat === bigName && appData.costItems[j].subCat === sub)
        appData.costItems[j].subCat = '';
    }
    saveData(); toast('已删除'); renderCostCatManageList();
  });
}

// ============ RATES TAB ============
// 依赖: appData.rates/activeCurrencies(DATA), saveData(DATA), formatMoney(UTILS),
//        openModal/closeAllModals(MODAL), showGistPanel(GIST云同步)
// 暴露: renderRates(), fetchRates(), showCurrencyManage(), showRateEditModal(code)
// 注意: appData.rates格式固定为"1 CNY = ?该币种"，fetchRates()从open.er-api.com更新
// UI入口: Tab切换时由renderTab()调用renderRates()
// 汇率显示：至少 4 位小数；小于 0.1 的补到 4 位有效数字（如 1 韩元 = 0.005300 人民币）
function rateFmt(v) {
  if (!(v > 0)) return '0';
  var dec = Math.max(4, 3 - Math.floor(Math.log(v) / Math.LN10 + 1e-9));
  return v.toFixed(Math.min(dec, 10));
}

function renderRates() {
  var rates = appData.rates;
  var active = appData.activeCurrencies;
  var baseInfo = CURRENCY_NAMES;

  var baseSel = $('baseCurrency');
  var prevBase = baseSel.value;
  if (!renderRates._restored) {
    // 首次渲染：恢复上次选的基准币种和金额
    renderRates._restored = true;
    var vs = appData.rateViewState;
    if (vs && vs.amount) $('rateAmount').value = vs.amount;
    if (vs && vs.base) prevBase = vs.base;
  }
  if (active.indexOf('CNY')<0) active.unshift('CNY');
  var selOpts = '';
  for (var i=0;i<active.length;i++) {
    var code = active[i];
    selOpts += '<option value="'+code+'"'+(code===prevBase?' selected':'')+'>'+code+' - '+(baseInfo[code]||code)+'</option>';
  }
  baseSel.innerHTML = selOpts;
  if (active.indexOf(prevBase) >= 0) baseSel.value = prevBase;

  var base = baseSel.value;
  // 汇率表里没有的币种（CNY 除外）算作"暂无汇率"，不再按 1:1 显示
  var rateOf = function(c) { var r = rates[c]; return r > 0 ? r : (c === 'CNY' ? 1 : 0); };
  var baseRate = rateOf(base);
  var amount = parseFloat($('rateAmount').value) || 1;

  var cardsHtml = '';
  for (var ai=0;ai<active.length;ai++) {
    var c = active[ai];
    if (c===base) continue;
    var infoName = baseInfo[c] || c;
    var targetRate = rateOf(c);
    var head = '<div class="rate-card"><div class="rate-info"><h4>'+c+'</h4><span>'+infoName+'</span></div>' +
      '<button class="rate-swap-btn" onclick="swapBaseCurrency(\''+c+'\')" title="以'+c+'为基准换算">⇄</button>';
    if (!(baseRate > 0 && targetRate > 0)) {
      var missingCode = baseRate > 0 ? c : base;
      cardsHtml += head + '<div class="rate-value"><div class="rate-converted">暂无汇率</div>' +
        '<div class="rate-amount">点"更新汇率"，或 <span class="rate-edit-icon" onclick="showEditRateModal(\''+missingCode+'\')" title="手动编辑汇率">✎</span> 手动填写 '+missingCode+'</div></div></div>';
      continue;
    }
    var rate = targetRate / baseRate;
    var converted = amount * rate;
    cardsHtml += head +
      '<div class="rate-value"><div class="rate-converted">'+amount+' '+base+' = ' + formatMoney(converted) + ' '+c+'</div>' +
      '<div class="rate-amount">1 '+base+' = '+rateFmt(rate)+' '+c+' <span class="rate-edit-icon" onclick="showEditRateModal(\''+c+'\')" title="手动编辑汇率">✎</span></div></div></div>';
  }
  $('rateCards').innerHTML = cardsHtml || '<div class="empty-tip">请选择币种</div>';
  $('rateUpdateTime').textContent = appData.rateUpdateTime ? '上次更新: '+appData.rateUpdateTime : '';
  updateGistBtnLabel();
  // 记住基准币种和金额（下次打开恢复）
  var vsOld = appData.rateViewState || {};
  if (vsOld.base !== base || String(vsOld.amount) !== $('rateAmount').value) {
    appData.rateViewState = { base: base, amount: $('rateAmount').value };
    saveData();
  }
}

function showEditRateModal(code) {
  var cur = appData.rates[code] || 0;
  var inv = cur>0 ? (1/cur) : 0;
  openModalShell({id:'rateEditOverlay', title:'编辑汇率', ok:'保存', okFn:'saveEditRate(\''+code+'\')', body:
    '<div style="font-size:var(--fs-12);color:var(--text2);margin-bottom:12px;">手动设置后将覆盖当前数值；下次点"更新汇率"会被最新数据重新覆盖。两个输入框互为倒数，改任意一个另一个自动同步。</div>' +
    '<div class="form-row"><label>1 CNY = ? ' + code + '</label><input type="number" id="editRateInput" value="'+(cur||'')+'" step="any" autocomplete="off" oninput="syncRateInput(\'editRateInput\',\'editRateInputInv\')"></div>' +
    '<div class="form-row"><label>1 ' + code + ' = ? CNY</label><input type="number" id="editRateInputInv" value="'+(inv||'')+'" step="any" autocomplete="off" oninput="syncRateInput(\'editRateInputInv\',\'editRateInput\')"></div>'});
}
function syncRateInput(fromId, toId) {
  var v = parseFloat($(fromId).value);
  if (v>0) $(toId).value = (1/v).toFixed(6).replace(/\.?0+$/,'');
}
function saveEditRate(code) {
  var v = parseFloat($('editRateInput').value);
  if (!v || v<=0) { toast('请输入有效汇率', true); return; }
  appData.rates[code] = v;
  saveData(); toast('已更新');
  closeModal();
  renderRates();
}

function swapBaseCurrency(code) {
  var baseSel = $('baseCurrency');
  baseSel.value = code;
  renderRates();
}

var CURRENCY_CANDIDATES = ['CNY','USD','JPY','EUR','GBP','KRW','THB','AUD','CAD','HKD','SGD','MYR','PHP','IDR','VND','INR','CHF','NZD','AED','RUB','BRL','MXN'];
function showCurrencyManage() {
  // 常用币种在前，其后是汇率表里的其他币种；已启用但不在表里的也保留
  var allCodes = CURRENCY_CANDIDATES.slice();
  var extra = Object.keys(appData.rates).filter(function(c){ return allCodes.indexOf(c) < 0 && c.length === 3; }).sort();
  allCodes = allCodes.concat(extra);
  for (var ai=0; ai<appData.activeCurrencies.length; ai++) { if (allCodes.indexOf(appData.activeCurrencies[ai]) < 0) allCodes.push(appData.activeCurrencies[ai]); }
  var names = CURRENCY_NAMES;
  var html = '<input type="text" id="curSearch" class="input-box" placeholder="搜索币种代码或名称" autocomplete="off" oninput="filterCurrencyList()" style="margin-bottom:8px;">' +
    '<div id="curList" style="max-height:400px;overflow-y:auto;">';
  for (var i=0;i<allCodes.length;i++) {
    var c = allCodes[i];
    var isActive = appData.activeCurrencies.indexOf(c) >= 0;
    html += '<div class="currency-item" data-code="'+c+'" data-key="'+escHtml((c+' '+(names[c]||'')).toLowerCase())+'" onclick="toggleCurrency(\''+c+'\')">' +
      '<span><span class="curr-code">'+c+'</span><span class="curr-name">'+(names[c]||'')+'</span></span>' +
      '<span class="curr-check">'+(isActive?'✓':'')+'</span></div>';
  }
  html += '</div>';
  var overlay = openModalShell({id:'currencyManageOverlay', title:'管理币种', body:html,
    footer:'<button class="btn btn-primary" onclick="closeAllModals();renderRates();">完成</button>'});
}
function filterCurrencyList() {
  var q = ($('curSearch').value || '').trim().toLowerCase();
  var items = document.querySelectorAll('#curList .currency-item');
  for (var i=0; i<items.length; i++) {
    items[i].style.display = (!q || items[i].getAttribute('data-key').indexOf(q) >= 0) ? '' : 'none';
  }
}
function toggleCurrency(code) {
  if (code==='CNY') return;
  var idx = appData.activeCurrencies.indexOf(code);
  if (idx>=0) appData.activeCurrencies.splice(idx,1);
  else appData.activeCurrencies.push(code);
  saveData();
  // 原地更新勾选状态（不重开弹窗，列表位置和搜索词保持不变）
  var row = document.querySelector('#curList .currency-item[data-code="' + code + '"] .curr-check');
  if (row) row.textContent = idx>=0 ? '' : '✓';
  renderRates();
}

function fetchRates(btn) {
  btn = btn || document.querySelector('[onclick^="fetchRates("]');
  btn.textContent = '更新中...'; btn.disabled = true;
  fetch('https://open.er-api.com/v6/latest/CNY')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.result==='success' && data.rates) {
        appData.rates = data.rates;
        appData.rateUpdateTime = new Date().toLocaleString('zh-CN');
        saveData();
        renderRates();
        toast('汇率已更新');
      } else { toast('汇率更新失败', true); }
    })
    .catch(function(){ toast('网络错误，请稍后重试', true); })
    .finally(function(){ btn.textContent='更新汇率'; btn.disabled=false; });
}

// ============ RATE COMPARE (直接/间接兑换) ============
// 依赖: appData.rates/activeCurrencies/rateCompareState(DATA), saveData(DATA),
//        formatMoney/CURRENCY_NAMES(UTILS), switchTab(TAB SWITCH)
// 暴露: showRateCompare(), closeRateCompare(), renderRateCompare(), rcFetchLeg(key),
//        onRcCurrencyChange(), RC_STRENGTH_RANK, rcRank(), rcDisp()
// 注意: 汇率方向(乘/除)完全由rcOrientationFlags()的强弱排名决定，改标签前务必确认排名逻辑
//        "获取"按钮(rcFetchLeg)从appData.rates取参考值，不自动填充，需用户手动点击
var RC_STRENGTH_RANK = ['EUR','GBP','USD','CHF','AUD','NZD','CAD','SGD','HKD','CNY','MYR','THB','PHP','INR','IDR','JPY','KRW','VND','RUB','BRL','MXN','AED'];
function rcRank(code) {
  var idx = RC_STRENGTH_RANK.indexOf(code);
  return idx >= 0 ? idx : RC_STRENGTH_RANK.length;
}
function rcDisp(code) { return code === 'CNY' ? 'CNH' : code; }
// 从汇率表(appData.rates，以CNY为基准存"1CNY=?该币种")取某币种的相对汇率
function rcTableRate(code) {
  if (code === 'CNY') return 1;
  var r = appData.rates[code];
  return (r && r > 0) ? r : null;
}
function rcFmtRate(v) { return v.toFixed(6).replace(/\.?0+$/,''); }
// 给"1 X = ? Y"方向的框，用汇率表算参考值；表里缺数据返回null
function rcDefaultForPair(xCode, yCode) {
  var rx = rcTableRate(xCode), ry = rcTableRate(yCode);
  if (rx===null || ry===null) return null;
  return rcFmtRate(ry / rx);
}
// 根据持有/目标币种的强弱排序，决定5个框各自谁是base（分子）
function rcOrientationFlags(hold, target) {
  return {
    dirTargetIsBase: rcRank(target) < rcRank(hold),
    usdLeg1HoldIsBase: rcRank(hold) < rcRank('USD'),
    hkdLeg1HoldIsBase: rcRank(hold) < rcRank('HKD'),
    usdLeg2TargetIsBase: rcRank(target) < rcRank('USD'),
    hkdLeg2TargetIsBase: rcRank(target) < rcRank('HKD')
  };
}
// 5个汇率框的映射表：key → { inputId, x/y 由持有/目标币种动态确定 }
// 点"获取"时从 appData.rates（以CNY为基准）算出对应方向的参考值填入框里，
// 用户看了再决定要不要用，不会自动覆盖——框里的内容完全由用户自己掌控
function rcFetchLeg(key) {
  var hold = $('rcHoldCurrency').value, target = $('rcTargetCurrency').value;
  var o = rcOrientationFlags(hold, target);
  var map = {
    direct:  { id:'rcDirectRate', x: o.dirTargetIsBase?target:hold,         y: o.dirTargetIsBase?hold:target },
    usdLeg1: { id:'rcUsdLeg1',   x: o.usdLeg1HoldIsBase?hold:'USD',        y: o.usdLeg1HoldIsBase?'USD':hold },
    hkdLeg1: { id:'rcHkdLeg1',   x: o.hkdLeg1HoldIsBase?hold:'HKD',        y: o.hkdLeg1HoldIsBase?'HKD':hold },
    usdLeg2: { id:'rcUsdLeg2',   x: o.usdLeg2TargetIsBase?target:'USD',    y: o.usdLeg2TargetIsBase?'USD':target },
    hkdLeg2: { id:'rcHkdLeg2',   x: o.hkdLeg2TargetIsBase?target:'HKD',   y: o.hkdLeg2TargetIsBase?'HKD':target }
  };
  var leg = map[key];
  if (!leg) return;
  var def = rcDefaultForPair(leg.x, leg.y);
  if (def !== null) {
    $(leg.id).value = def;
    renderRateCompare();
  } else {
    toast('汇率表里没有 ' + leg.x + ' 或 ' + leg.y + ' 的数据，请先在汇率Tab里补充', true);
  }
}
// 持有/目标币种下拉框 onchange：直接重新渲染，不自动填充汇率框
function onRcCurrencyChange() {
  renderRateCompare();
}
function showRateCompare() {
  var pages = document.querySelectorAll('.page');
  for (var i=0;i<pages.length;i++) { pages[i].classList.remove('active'); }
  $('page-rate-compare').classList.add('active');
  closeAllModals();

  var active = appData.activeCurrencies.slice();
  if (active.indexOf('CNY')<0) active.unshift('CNY');
  var holdSel = $('rcHoldCurrency'), targetSel = $('rcTargetCurrency');
  if (!holdSel.options.length) {
    var opts = '';
    for (var i2=0;i2<active.length;i2++) { var code=active[i2]; opts += '<option value="'+code+'">'+code+' - '+(CURRENCY_NAMES[code]||code)+'</option>'; }
    holdSel.innerHTML = opts;
    targetSel.innerHTML = opts;
    var st = appData.rateCompareState || {};
    holdSel.value = (st.hold && active.indexOf(st.hold)>=0) ? st.hold : 'CNY';
    var firstOther = active.filter(function(c){ return c!==holdSel.value; })[0];
    targetSel.value = (st.target && active.indexOf(st.target)>=0 && st.target!==holdSel.value) ? st.target : (firstOther||'');
    $('rcHoldAmount').value = (st.amount!==undefined && st.amount!==null && st.amount!=='') ? st.amount : 100;
    $('rcDirectRate').value = (st.directRate!==undefined && st.directRate!==null) ? st.directRate : '';
    $('rcUsdLeg1').value = (st.usdLeg1!==undefined && st.usdLeg1!==null) ? st.usdLeg1 : '';
    $('rcUsdLeg2').value = (st.usdLeg2!==undefined && st.usdLeg2!==null) ? st.usdLeg2 : '';
    $('rcHkdLeg1').value = (st.hkdLeg1!==undefined && st.hkdLeg1!==null) ? st.hkdLeg1 : '';
    $('rcHkdLeg2').value = (st.hkdLeg2!==undefined && st.hkdLeg2!==null) ? st.hkdLeg2 : '';
  }
  renderRateCompare();
}
function closeRateCompare() {
  switchTab('rates');
}
function renderRateCompare() {
  var hold = $('rcHoldCurrency').value;
  var target = $('rcTargetCurrency').value;
  var amount = parseFloat($('rcHoldAmount').value) || 0;
  var directRate = parseFloat($('rcDirectRate').value);
  var usdLeg1 = parseFloat($('rcUsdLeg1').value);
  var usdLeg2 = parseFloat($('rcUsdLeg2').value);
  var hkdLeg1 = parseFloat($('rcHkdLeg1').value);
  var hkdLeg2 = parseFloat($('rcHkdLeg2').value);

  var newState = {
    hold: hold, target: target,
    amount: $('rcHoldAmount').value,
    directRate: $('rcDirectRate').value,
    usdLeg1: $('rcUsdLeg1').value, usdLeg2: $('rcUsdLeg2').value,
    hkdLeg1: $('rcHkdLeg1').value, hkdLeg2: $('rcHkdLeg2').value
  };
  if (JSON.stringify(newState) !== JSON.stringify(appData.rateCompareState||{})) {
    appData.rateCompareState = newState;
    saveData();
  }

  // 标签随持有/目标币种联动更新（不重建input，避免输入值被打回）
  var o = rcOrientationFlags(hold, target);
  var dirTargetIsBase = o.dirTargetIsBase; // 目标币种比持有"强"，目标当base（分子）
  $('rcDirectLabel').textContent = dirTargetIsBase ? (rcDisp(target) + '/' + rcDisp(hold)) : (rcDisp(hold) + '/' + rcDisp(target));
  var usdLeg1HoldIsBase = o.usdLeg1HoldIsBase; // 持有币种比USD"强"，持有当base
  var hkdLeg1HoldIsBase = o.hkdLeg1HoldIsBase;
  $('rcUsdLeg1Label').textContent = usdLeg1HoldIsBase ? (rcDisp(hold) + '/USD') : ('USD/' + rcDisp(hold));
  $('rcHkdLeg1Label').textContent = hkdLeg1HoldIsBase ? (rcDisp(hold) + '/HKD') : ('HKD/' + rcDisp(hold));
  var usdLeg2TargetIsBase = o.usdLeg2TargetIsBase; // 目标币种比USD"强"，目标当base
  var hkdLeg2TargetIsBase = o.hkdLeg2TargetIsBase;
  $('rcUsdLeg2Label').textContent = usdLeg2TargetIsBase ? (rcDisp(target) + '/USD') : ('USD/' + rcDisp(target));
  $('rcHkdLeg2Label').textContent = hkdLeg2TargetIsBase ? (rcDisp(target) + '/HKD') : ('HKD/' + rcDisp(target));

  // 直接兑换结果（目标当base时，输入的是"1目标=?持有"，需用除法换算）
  var directResult = null, usdFinal = null, hkdFinal = null;
  if (directRate>0 && amount>0) {
    directResult = dirTargetIsBase ? (amount/directRate) : (amount*directRate);
    $('rcDirectResult').className = 'rc-leg-result';
    $('rcDirectResult').innerHTML = amount+' '+rcDisp(hold)+' = <span class="rc-leg-amt">'+formatMoney(directResult)+' '+rcDisp(target)+'</span>';
  } else {
    $('rcDirectResult').className = 'rc-leg-result rc-leg-empty';
    $('rcDirectResult').textContent = '';
  }

  // 中转币种与持有/目标相同时，路径无意义，整张卡片（含置顶的基准汇率行）隐藏
  var usdPathHidden = (hold==='USD' || target==='USD');
  var hkdPathHidden = (hold==='HKD' || target==='HKD');
  $('rcUsdCard').style.display = usdPathHidden ? 'none' : '';
  $('rcHkdCard').style.display = hkdPathHidden ? 'none' : '';
  $('rcUsdLeg1Row').style.display = usdPathHidden ? 'none' : '';
  $('rcHkdLeg1Row').style.display = hkdPathHidden ? 'none' : '';
  $('rcBaseRatesCard').style.display = (usdPathHidden && hkdPathHidden) ? 'none' : '';

  // 经美元（按持有币种是否比USD"强"决定第一段乘除；第二段同理按target是否为base决定乘除）
  if (usdLeg1>0 && usdLeg2>0 && amount>0) {
    var usdMid = usdLeg1HoldIsBase ? (amount*usdLeg1) : (amount/usdLeg1);
    usdFinal = usdLeg2TargetIsBase ? (usdMid/usdLeg2) : (usdMid*usdLeg2);
    $('rcUsdResult').className = 'rc-leg-result';
    $('rcUsdResult').innerHTML = amount+' '+rcDisp(hold)+' → '+formatMoney(usdMid)+' USD → <span class="rc-leg-amt">'+formatMoney(usdFinal)+' '+rcDisp(target)+'</span>';
  } else {
    $('rcUsdResult').className = 'rc-leg-result rc-leg-empty';
    $('rcUsdResult').textContent = '';
  }

  // 经港币（按持有币种是否比HKD"强"决定第一段乘除）
  if (hkdLeg1>0 && hkdLeg2>0 && amount>0) {
    var hkdMid = hkdLeg1HoldIsBase ? (amount*hkdLeg1) : (amount/hkdLeg1);
    hkdFinal = hkdLeg2TargetIsBase ? (hkdMid/hkdLeg2) : (hkdMid*hkdLeg2);
    $('rcHkdResult').className = 'rc-leg-result';
    $('rcHkdResult').innerHTML = amount+' '+rcDisp(hold)+' → '+formatMoney(hkdMid)+' HKD → <span class="rc-leg-amt">'+formatMoney(hkdFinal)+' '+rcDisp(target)+'</span>';
  } else {
    $('rcHkdResult').className = 'rc-leg-result rc-leg-empty';
    $('rcHkdResult').textContent = '';
  }

  // 有结果的路径中找最优（兑换到目标货币最多的那条），粗体绿色高亮
  var results = [
    { val: directResult, el: $('rcDirectResult') },
    { val: usdPathHidden ? null : usdFinal, el: $('rcUsdResult') },
    { val: hkdPathHidden ? null : hkdFinal, el: $('rcHkdResult') }
  ].filter(function(r){ return r.val !== null && r.val > 0; });
  var best = results.length > 1 ? Math.max.apply(null, results.map(function(r){ return r.val; })) : null;
  results.forEach(function(r) {
    var amtSpan = r.el.querySelector('.rc-leg-amt');
    if (!amtSpan) return;
    if (best !== null && r.val === best) {
      amtSpan.style.color = 'var(--success, #22a861)';
      amtSpan.style.fontWeight = '700';
    } else {
      amtSpan.style.color = '';
      amtSpan.style.fontWeight = '';
    }
  });
}

// ============ INIT ============
// 依赖: loadData(DATA), renderTab(TAB SWITCH), checkBackupReminder(BACKUP REMINDER)
// 暴露: init()
// 注意: init()在脚本末尾直接调用（不是body onload），是整个App的唯一启动入口
function init() {
  loadData();
  renderTab('daily');
  $('fabBtn').style.display = 'none';
  checkBackupReminder();
  var resizeTimer = null;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() { renderTab(currentTab); }, 200);
  });
}

init();


</script>
